<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MyoSignals</title>
<meta name="theme-color" content="#0E0E0E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800;1,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #F1F4EE;
    --surface: #FCFDFB;
    --surface-2: #E7ECE3;
    --border: #D2DCCF;
    --text: #17251D;
    --text-secondary: #536457;
    --text-muted: #78867B;
    --signal: #B7E449;
    --signal-rgb: 183,228,73;
    --signal-glow: rgba(183,228,73,0.2);
    --amber: #9A5B11;
    --amber-bg: #F9EBD4;
    --red: #B43D36;
    --red-bg: #F8E4DF;
    --radius: 8px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111812;
      --surface: #1A241C;
      --surface-2: #232F25;
      --border: #344337;
      --text: #EFF5E8;
      --text-secondary: #B0BEAD;
      --text-muted: #849383;
      --signal: #C7F36A;
      --signal-rgb: 199,243,106;
      --signal-glow: rgba(199,243,106,0.2);
      --amber: #F1B45B;
      --amber-bg: #382B18;
      --red: #F07869;
      --red-bg: #38201D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111812;
    --surface: #1A241C;
    --surface-2: #232F25;
    --border: #344337;
    --text: #EFF5E8;
    --text-secondary: #B0BEAD;
    --text-muted: #849383;
    --signal: #C7F36A;
    --signal-rgb: 199,243,106;
    --signal-glow: rgba(199,243,106,0.2);
    --amber: #F1B45B;
    --amber-bg: #382B18;
    --red: #F07869;
    --red-bg: #38201D;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hero-title, .page-title { font-family: 'Space Grotesk', 'DM Sans', sans-serif; letter-spacing: 0; }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }
  .screen.wide { max-width: 640px; }

  /* ---------- Landing ---------- */
  .landing { justify-content: space-between; min-height: 100vh; padding-top: env(safe-area-inset-top, 24px); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--signal-glow); display: flex; align-items: center; justify-content: center; }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .hero-wave { width: 100%; height: 140px; margin: 28px 0 8px; }
  .hero-title { font-size: 34px; line-height: 1.12; font-weight: 700; margin: 0 0 14px; }
  .hero-sub { font-size: 15px; line-height: 1.55; color: var(--text-secondary); margin: 0 0 28px; max-width: 40ch; }
  .cta-row { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Buttons & inputs ---------- */
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    background: var(--signal); color: #06140E; font-weight: 600; font-size: 15px;
    padding: 14px 18px; border-radius: 10px; width: 100%;
  }
  .btn-secondary {
    background: transparent; color: var(--text); font-weight: 500; font-size: 15px;
    padding: 14px 18px; border-radius: 10px; width: 100%; border: 1px solid var(--border);
  }
  .btn-ghost { background: none; color: var(--text-secondary); font-size: 14px; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size: 15px; font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
  .profile-editor { width: 100%; max-width: 760px; }
  .profile-photo-row { display: flex; align-items: center; gap: 18px; margin: 20px 0 26px; }
  .profile-avatar { width: 88px; height: 88px; flex: 0 0 88px; overflow: hidden; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--text-secondary); font-size: 30px; font-weight: 600; }
  .profile-avatar-image { width: 100%; height: 100%; object-fit: cover; }
  .profile-photo-details { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .profile-photo-details p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .photo-picker { position: relative; display: inline-flex; width: auto; padding: 10px 14px; }
  .photo-picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .profile-fields { display: grid; grid-template-columns: 1fr; }
  .profile-feedback { display: none; margin: 12px 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
  .profile-feedback.error { color: var(--red); background: var(--red-bg); border: 1px solid var(--red); }
  .profile-feedback.success { color: var(--text); background: var(--signal-glow); border: 1px solid var(--signal); }
  .error-text {
    color: var(--red); background: var(--red-bg); border: 1px solid var(--red);
    border-radius: 8px; font-size: 13px; line-height: 1.45; margin: 12px 0 16px; padding: 10px 12px;
  }

  /* ---------- Auth / Profile ---------- */
  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .back-btn { background: none; padding: 6px; color: var(--text-secondary); }
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  .page-sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 24px; }

  /* ---------- Dashboard shell ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .user-avatar { width: 28px; height: 28px; flex: 0 0 28px; object-fit: cover; border-radius: 50%; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px var(--signal-glow); }
  .logout-link { font-size: 13px; color: var(--text-secondary); background: none; text-decoration: underline; text-underline-offset: 2px; }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 22px; }
  .tab-btn { flex: 1; background: none; padding: 9px 4px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .tab-btn.active { background: var(--surface); color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .metrics-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .metric { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px; text-align: left; }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: none; }
  .metric-value { font-size: 28px; font-weight: 600; line-height: 1; }

  .fatigue-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .fatigue-low { background: var(--surface-2); color: var(--text-secondary); }
  .fatigue-mid { background: var(--amber-bg); color: var(--amber); }
  .fatigue-high { background: var(--red-bg); color: var(--red); }

  .bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--signal); border-radius: 4px; transition: width 0.08s linear; }

  .controls-row { display: flex; gap: 10px; margin-top: 4px; }
  .controls-row button { flex: 1; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600; }

  .plan-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-label { font-size: 14px; color: var(--text-secondary); }
  .plan-item-value { font-size: 15px; font-weight: 600; }

  .session-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .session-row:last-child { border-bottom: none; }
  .session-date { font-size: 14px; }
  .session-stats { font-size: 13px; color: var(--text-secondary); }
  .empty-state { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 14px; }

  .note {
    font-size: 12px; color: var(--text-muted); background: var(--surface-2);
    border-radius: 10px; padding: 12px 14px; line-height: 1.5; margin-top: 6px;
  }
  a, a:visited { color: inherit; }

  .verified-banner {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%);
    background: var(--signal); color: #06140E; font-weight: 600; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18); z-index: 999;
    animation: banner-in 0.25s ease-out;
  }
  @keyframes banner-in { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .verified-banner.error { background: var(--red); color: #fff; }
  .phase-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; background: var(--surface-2); color: var(--text-secondary); }
  .phase-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
  .phase-running { color: var(--text); }
  .phase-running::before { background: var(--signal); box-shadow: 0 0 0 4px var(--signal-glow); animation: live-pulse 1.8s ease-in-out infinite; }
  .phase-paused, .phase-confirming { background: var(--amber-bg); color: var(--amber); }
  .phase-paused::before, .phase-confirming::before { background: var(--amber); }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); margin-left: 6px; vertical-align: middle; }
  button:disabled { opacity: 0.55; cursor: default; }
  .phase-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .phase-row .phase-pill { margin-bottom: 0; }
  .training-view > .phase-row { grid-column: 1 / -1; }
  .sensor-card { display: flex; flex-direction: column; gap: 8px; }
  .training-view > .sensor-card { grid-column: 2; align-self: stretch; margin: 0; }
  .sensor-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sensor-text { font-size: 13px; line-height: 1.5; color: var(--text-secondary); min-height: 20px; }
  .sensor-label { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .sensor-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
  .sensor-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .sensor-live { color: var(--text); }
  .sensor-live::before { background: var(--signal); box-shadow: 0 0 0 4px var(--signal-glow); }
  .sensor-stale { color: var(--red); }
  .sensor-stale::before { background: var(--red); }
  .sensor-waiting::before, .sensor-connecting::before { background: var(--amber); }
  .fatigue-sindatos { opacity: 0.75; }
  .fatigue-card { display: flex; flex-direction: column; gap: 10px; transition: background 0.4s ease, border-color 0.4s ease; }
  .fatigue-label { font-size: 13px; color: var(--text-secondary); }
  .fatigue-title { font-family: 'Space Grotesk', 'DM Sans', sans-serif; font-size: 22px; font-weight: 600; color: var(--text); }
  .fatigue-text { font-size: 14px; line-height: 1.5; color: var(--text-secondary); }
  .fatigue-track { height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .fatigue-fill { height: 100%; width: 0; border-radius: 999px; transition: width 0.6s ease, background 0.6s ease; }
  .fatigue-leve { border-color: var(--amber); }
  .fatigue-moderada { background: var(--amber-bg); border-color: var(--amber); }
  .fatigue-sinref { border-color: var(--red); }
  .sensor-connect { width: auto; align-self: flex-start; padding: 10px 14px; }
  .sensor-inline { display: flex; align-items: center; gap: 10px; }
  .sensor-inline .sensor-connect { padding: 6px 12px; font-size: 13px; }
  .sensor-off::before, .sensor-nosoportado::before { background: var(--text-muted); }
  .fatigue-alta { background: var(--red-bg); border-color: var(--red); border-width: 2px; }
  .fatigue-alta .fatigue-title { color: var(--red); }
  .fatigue-alta .fatigue-text { color: var(--text); font-weight: 500; }
  .fatigue-alta .fatigue-title::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 10px; border-radius: 50%; background: var(--red); vertical-align: middle; animation: stop-blink 1s ease-in-out infinite; }
  @keyframes stop-blink { 50% { opacity: 0.25; } }
  .training-view { min-width: 0; }
  .training-view > .phase-pill { margin-bottom: 12px; }
  .set-progress { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 14px; border-left: 3px solid var(--signal); border-radius: 6px; background: var(--signal-glow); }
  .set-progress strong { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
  .set-progress span { color: var(--text-secondary); font-size: 13px; }
  .training-view-resting { min-height: min(62vh, 520px); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .training-view-resting .set-progress { margin: 0; }
  .rest-progress { min-height: 0; padding: 16px 8px; flex-direction: column; justify-content: center; gap: 18px; text-align: center; background: transparent; border: 0; box-shadow: none; }
  .rest-copy { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .rest-copy .rest-kicker { color: var(--text-secondary); font-size: 12px; font-weight: 700; }
  .rest-copy strong { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 20px; }
  .rest-copy .rest-caption { color: var(--text-muted); font-size: 13px; }
  .rest-progress .rest-timer { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 80px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .rest-actions { width: min(100%, 420px); margin: 0 auto; flex-direction: column; gap: 10px; }
  .set-complete-btn { margin: 0 0 10px; }
  .completed-set-list { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .completed-set-heading, .completed-set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .completed-set-heading { margin-bottom: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .completed-set-row { padding: 7px 0; border-top: 1px solid var(--border); font-size: 12px; }
  .completed-set-row span:first-child { color: var(--text); font-weight: 600; }
  .completed-set-row span:last-child { color: var(--text-secondary); text-align: right; }
  .session-group { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .session-group:last-child { border-bottom: none; }
  .session-group-heading { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; font-weight: 600; }
  .session-set-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; color: var(--text-secondary); font-size: 13px; }
  .signal-card { overflow: hidden; }
  .signal-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 14px; color: var(--text-secondary); font-size: 13px; }
  .signal-heading strong { color: var(--text); font-weight: 600; }
  .signal-canvas { width: 100%; height: 170px; display: block; border-radius: 6px; }
  .activation-card { background: var(--surface-2); }
  .activation-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; color: var(--text-secondary); font-size: 13px; }
  .activation-heading .mono { color: var(--text); font-size: 16px; font-weight: 600; }
  .training-start-card { padding: 28px; }
  .training-start-card .page-title { font-size: 24px; }
  .training-start-card .btn-primary { margin-top: 4px; }
  .training-note { line-height: 1.6; }
  .controls-row button { transition: transform 0.18s ease, filter 0.18s ease; }
  @keyframes live-pulse { 50% { box-shadow: 0 0 0 7px rgba(var(--signal-rgb), 0.08); } }

  @media (hover: hover) {
    button:not(:disabled):hover { filter: brightness(1.04); }
    .controls-row button:not(:disabled):hover { transform: translateY(-1px); }
  }

  @media (min-width: 900px) {
    .screen { max-width: 560px; padding: 44px 32px 56px; }
    .screen:not(.wide):not(.landing) { justify-content: center; }
    .screen.wide { max-width: 1120px; padding: 36px 48px 56px; }
    .screen.wide .card { padding: 24px; }
    .screen.wide .metrics-row { gap: 16px; }
    .screen.wide .metric { padding: 20px 16px; }
    .screen.wide .metric-value { font-size: 30px; }
    .training-view { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.75fr); gap: 14px 20px; align-items: start; }
    .training-view > .phase-pill, .training-view > .set-progress, .training-view > .metrics-row, .training-view > .set-complete-btn, .training-view > .controls-row, .training-view > .training-note { grid-column: 1 / -1; }
    .training-view > .signal-card { grid-column: 1; margin: 0; }
    .training-view > .activation-card { grid-column: 2; align-self: stretch; margin: 0; }
    .training-view > .confirm-card { grid-column: 1 / -1; margin: 0; }
    .signal-canvas { height: 230px; }
    .training-view > .training-start-card { grid-column: 1; margin: 0; }
    .training-view > .training-note.start-note { grid-column: 2; align-self: stretch; margin: 0; display: flex; align-items: center; }
    .profile-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }

    .landing {
      display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      grid-template-rows: auto 1fr; column-gap: 64px; align-items: center;
      max-width: 1200px; padding: 32px 56px 48px;
    }
    .landing > :first-child { grid-column: 1 / -1; align-self: start; }
    .landing > :nth-child(2) { grid-column: 1; grid-row: 2; }
    .landing > :nth-child(3) { grid-column: 2; grid-row: 2; align-self: center; width: 100%; max-width: 340px; }
    .hero-wave { height: 180px; margin: 32px 0 16px; }
    .hero-title { max-width: 16ch; font-size: 44px; }
    .hero-sub { font-size: 16px; }
    .cta-row { gap: 12px; }
  }

  @media (max-width: 480px) {
    .session-row { align-items: flex-start; flex-direction: column; gap: 6px; }
    .session-stats { overflow-wrap: anywhere; }
    .metric { padding: 14px 10px; }
    .metric-value { font-size: 24px; }
    .training-view-resting { min-height: 58vh; gap: 12px; }
    .rest-progress { gap: 14px; }
    .rest-copy strong { font-size: 18px; }
    .rest-progress .rest-timer { font-size: 60px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  /* =========================================================
     MYOSIGNALS — estética de la marca (negro, lima, Barlow + Inter)
     Este bloque pisa lo anterior: para volver al diseño viejo, borrarlo.
     ========================================================= */
  :root, :root[data-theme="dark"], :root[data-theme="light"] {
    --bg: #0E0E0E; --surface: #161616; --surface-2: #1F1F1F; --border: #2E2E2E;
    --text: #F4F4EF; --text-secondary: #A9A9A2; --text-muted: #6E6E68;
    --signal: #C6F800; --signal-rgb: 198,248,0; --signal-glow: rgba(198,248,0,0.14);
    --verde: #8FD14F;
    --amber: #F2B705; --amber-bg: rgba(242,183,5,0.10);
    --red: #F28C28; --red-bg: rgba(242,140,40,0.12);
    --radius: 4px;
    --titulo: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #0E0E0E; --surface: #161616; --surface-2: #1F1F1F; --border: #2E2E2E;
      --text: #F4F4EF; --text-secondary: #A9A9A2; --text-muted: #6E6E68;
      --amber: #F2B705; --amber-bg: rgba(242,183,5,0.10); --red: #F28C28; --red-bg: rgba(242,140,40,0.12);
    }
  }

<script>
/* =========================================================
   CONEXIÓN REAL A SUPABASE
   ========================================================= */
const SUPABASE_URL = 'https://lhzcprnlfbvjjswyjafp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoemNwcm5sZmJ2ampzd3lqYWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNjg2ODksImV4cCI6MjEwNTk0NDY4OX0.Yud1fajPzlWdYxxrVV-oEL_sLUxjlnIP1T5PdT72l0A';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DB = {
  async signUp(email, password) {
    return await supa.auth.signUp({ email, password });
  },
  async signIn(email, password) {
    return await supa.auth.signInWithPassword({ email, password });
  },
  async signOut() {
    await supa.auth.signOut();
  },
  // Manda un mail con un link para restablecer la contraseña.
  // El link vuelve a esta misma página con #...&type=recovery en la URL.
  async sendPasswordReset(email) {
    return await supa.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname,
    });
  },
  async updatePassword(password) {
    return await supa.auth.updateUser({ password });
  },
  async getCurrentUser() {
    const { data } = await supa.auth.getUser();
    return data.user || null;
  },
  async getProfile(userId) {
    const { data } = await supa.from('profiles').select('*').eq('id', userId).maybeSingle();
    return data;
  },
  async saveProfile(userId, profile) {
    const { error } = await supa.from('profiles').upsert({ id: userId, ...profile });
    return { error };
  },
  async getSessions(userId) {
    const { data } = await supa.from('sessions').select('*').eq('user_id', userId).order('fecha', { ascending: false });
    return data || [];
  },
  async addSession(userId, session) {
    const { error } = await supa.from('sessions').insert({ user_id: userId, ...session });
    return { error };
  },
};

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const state = {
  screen: 'landing',   // landing | auth | resetPassword | profile | dashboard
  authMode: 'login',   // login | signup | forgot
  authError: '',
  authInfo: '',        // mensaje de éxito en la pantalla de auth (ej: "te mandamos un mail")
  user: null,
  tab: 'entrenar',      // entrenar | plan | historial
};

async function boot() {
  // Supabase redirige acá después de confirmar el mail, agregando datos
  // en el hash de la URL (#access_token=...&type=signup). Los detectamos
  // antes de que el cliente los "limpie" automáticamente.
  const hash = window.location.hash;
  if (hash.includes('type=signup') || hash.includes('type=email_change')) {
    state.justVerified = true;
  }
  // Link de "olvidé mi contraseña": entra con una sesión temporal y hay que pedir la clave nueva.
  if (hash.includes('type=recovery')) {
    state.recoveringPassword = true;
  }
  // Link vencido o ya usado: Supabase vuelve con #error=...
  let linkError = hash.includes('error=')
    ? (hash.includes('otp_expired') ? 'El link expiró o ya fue usado. Pedí uno nuevo.' : 'El link no es válido. Pedí uno nuevo.')
    : '';
  // limpiamos la URL para que no quede el token visible ni se re-muestre el cartel al refrescar
  if (state.justVerified || state.recoveringPassword || linkError) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  // getSession() espera a que el cliente termine de procesar la URL, a diferencia de getUser()
  const { data: { session } } = await supa.auth.getSession();
  if (state.recoveringPassword && !session?.user) {
    state.recoveringPassword = false;
    linkError = 'El link no es válido. Pedí uno nuevo.';
  }
  if (state.recoveringPassword) {
    state.user = { id: session.user.id, email: session.user.email, profile: null };
    state.screen = 'resetPassword';
  } else if (session?.user) {
    const profile = await DB.getProfile(session.user.id);
    state.user = { id: session.user.id, email: session.user.email, profile: profile || null };
    state.screen = profile ? 'dashboard' : 'profile';
    if (profile) state.sessions = await DB.getSessions(session.user.id);
  }
  render();

  if (state.justVerified) {
    showVerifiedBanner();
    state.justVerified = false;
  }
  if (linkError) {
    state.screen = 'auth';
    state.authMode = 'forgot';
    state.authError = linkError;
    render();
  }
}

function showBanner(text, isError) {
  const banner = el('div', { class: 'verified-banner' + (isError ? ' error' : '') }, [
    el('span', { html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>` }),
    el('span', {}, text),
  ]);
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 3500);
}
function showVerifiedBanner() { showBanner('Cuenta verificada'); }

/* =========================================================
   GENERADOR DE PLAN — reglas, sin IA externa
   ========================================================= */
function generarPlan(profile) {
  const { nivel, objetivo } = profile;
  const tablas = {
    hipertrofia: {
      principiante: { series: 3, repeticiones: '10-12', descanso: '60s', frecuencia: '2x por semana' },
      intermedio:   { series: 4, repeticiones: '8-10',  descanso: '75s', frecuencia: '3x por semana' },
      avanzado:     { series: 5, repeticiones: '6-8',   descanso: '90s', frecuencia: '3-4x por semana' },
    },
    resistencia: {
      principiante: { series: 3, repeticiones: '15-18', descanso: '30s', frecuencia: '2x por semana' },
      intermedio:   { series: 3, repeticiones: '18-22', descanso: '30s', frecuencia: '3x por semana' },
      avanzado:     { series: 4, repeticiones: '20-25', descanso: '25s', frecuencia: '3-4x por semana' },
    },
    fuerza: {
      principiante: { series: 3, repeticiones: '5-6',  descanso: '120s', frecuencia: '2x por semana' },
      intermedio:   { series: 4, repeticiones: '4-6',  descanso: '150s', frecuencia: '2-3x por semana' },
      avanzado:     { series: 5, repeticiones: '3-5',  descanso: '180s', frecuencia: '3x por semana' },
    },
  };
  return (tablas[objetivo] && tablas[objetivo][nivel]) || tablas.hipertrofia.principiante;
}

/* =========================================================
   SENSOR (ESP32) POR BLUETOOTH
   -----------------------------------------------------------
   Todo el procesamiento (filtros, repeticiones, MDF, fatiga) lo hace la ESP.
   La app se conecta por Web Bluetooth (Chrome o Edge, en la compu o en Android;
   iPhone no tiene Web Bluetooth), recibe un JSON por notificación en la
   característica FATIGA y le manda dos comandos por la característica COMANDO:
     'I' = START: la ESP empieza una serie (relajar -> calibrar -> medir)
     'S' = STOP:  la ESP termina la serie y deja de contar
     'N' = NUEVA SESIÓN: como 'I', pero la ESP olvida la referencia y vuelve a calibrar
   La referencia (el músculo descansado) se calibra en la serie 1 y la ESP la usa
   en todas las series del entrenamiento: así la serie 2 no arranca "de cero".
   Cuándo se mandan:
     Iniciar entrenamiento                    -> 'N'
     Iniciar serie N (después del descanso)   -> 'I'
     Terminar serie / Guardar / Descartar     -> 'S'
     Si el sensor se conecta con una serie en curso y la ESP está esperando ->
       'N' si todavía no llegó el de este entrenamiento, si no 'I'

   Paquete (v2), lo que manda la ESP cada 0,5 s y en cada repetición:
     { v: 2, seq, t, serie, reps, estado, fatiga, mdf, ref, act, rms, cal, rep, sat }
       seq     contador de paquetes (si salta, se perdieron paquetes)
       t       ms desde que arrancó la ESP
       serie   sube cada vez que se inicia una serie en la ESP (START o pulsador)
       reps    repeticiones de esa serie, acumuladas
       estado  'esperando' | 'relaja' | 'calibrando' | 'sin' | 'leve' | 'moderada' | 'alta' | 'sinref'
       fatiga  caída de la MDF respecto de la referencia [%] (se guarda en el historial)
     El resto (mdf, ref, act, rms, cal, rep, sat) es información técnica; la app no lo usa.
   ========================================================= */
const BLE_SENSOR = {
  nombre: 'MyoSignals',
  servicio: '8d1f0001-6c3a-4b8e-9a2e-3f1b2c4d5e60',
  fatiga: '8d1f0003-6c3a-4b8e-9a2e-3f1b2c4d5e60',
  comando: '8d1f0004-6c3a-4b8e-9a2e-3f1b2c4d5e60',
};
const CMD_INICIAR = 'I';
const CMD_DETENER = 'S';
const CMD_NUEVA_SESION = 'N';
const SENSOR_TIMEOUT_MS = 3000;   // sin paquetes durante este tiempo = sensor sin datos
const FATIGA_UMBRAL = { leve: 5, moderada: 10, alta: 13 };   // % de caída de la MDF, igual que el firmware
const ESTADOS = ['esperando', 'relaja', 'iniciando', 'sin', 'leve', 'moderada', 'alta', 'sinref'];

const sensor = {
  device: null, char: null, cmd: null,
  colaComandos: Promise.resolve(),   // los comandos se mandan de a uno
  inicioPedido: false,
  ultimoInicioMs: 0,                 // cuándo se mandó el último START
  conectando: false, error: '',
  last: null, lastAt: 0,
  received: 0, lost: 0, invalid: 0,
  tick: null,

  get soportado() { return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); },

  // Tiene que llamarse desde un click: el navegador muestra la lista de dispositivos.
  async connect() {
    if (!this.soportado || this.conectando) return;
    this.conectando = true; this.error = ''; refreshTrainingUi();
    try {
      const nuevo = !this.device;
      if (nuevo) {
        this.device = await navigator.bluetooth.requestDevice({
          filters: [{ name: BLE_SENSOR.nombre }],
          optionalServices: [BLE_SENSOR.servicio],
        });
        this.device.addEventListener('gattserverdisconnected', () => this.onDesconectado());
      }
      const server = await this.device.gatt.connect();
      const servicio = await server.getPrimaryService(BLE_SENSOR.servicio);
      if (this.char) this.char.removeEventListener('characteristicvaluechanged', this.onDato);
      this.char = await servicio.getCharacteristic(BLE_SENSOR.fatiga);
      this.char.addEventListener('characteristicvaluechanged', this.onDato);
      await this.char.startNotifications();
      this.cmd = await servicio.getCharacteristic(BLE_SENSOR.comando);
      // Si es una reconexión se conserva el último paquete: las repeticiones hechas
      // mientras estuvo cortado se suman igual (la ESP manda el total acumulado).
      if (nuevo) { this.last = null; this.lastAt = 0; this.received = 0; this.lost = 0; this.invalid = 0; }
      clearInterval(this.tick);
      this.tick = setInterval(refreshTrainingUi, 1000);   // para notar si deja de mandar
    } catch (e) {
      // Cerrar la lista sin elegir no es un error
      if (e.name !== 'NotFoundError') this.error = 'No se pudo conectar: ' + e.message;
      if (this.device && !this.device.gatt.connected) this.device = null;
    }
    this.conectando = false;
    refreshTrainingUi();
  },
  disconnect() {
    if (this.device && this.device.gatt.connected) this.device.gatt.disconnect();
  },
  // Manda un comando de un carácter a la ESP ('I' o 'S'). Si no hay conexión, no hace nada.
  enviar(comando) {
    this.colaComandos = this.colaComandos.then(async () => {
      if (!this.cmd || !this.conectado) return;
      try {
        await this.cmd.writeValue(new TextEncoder().encode(comando));
        if (comando === CMD_INICIAR || comando === CMD_NUEVA_SESION) this.ultimoInicioMs = Date.now();
        if (comando === CMD_NUEVA_SESION) training.sesionEnviada = true;
      }
      catch (e) { console.warn('No se pudo mandar el comando', comando, e); }
    });
    return this.colaComandos;
  },
  onDesconectado() {
    clearInterval(this.tick); this.tick = null;
    refreshTrainingUi();
  },
  onDato: (ev) => {
    let p;
    try { p = JSON.parse(new TextDecoder().decode(ev.target.value)); }
    catch { sensor.invalid++; return; }
    sensor.receive(p);
  },
  receive(p) {
    const ok = p && p.v === 2 && Number.isInteger(p.seq) && Number.isInteger(p.serie) && Number.isInteger(p.reps)
      && p.reps >= 0 && ESTADOS.includes(p.estado) && typeof p.fatiga === 'number';
    if (!ok) { this.invalid++; return; }
    if (this.last && p.seq > this.last.seq + 1) this.lost += p.seq - this.last.seq - 1;
    // Serie en curso en la app pero la ESP esperando (se conectó después de tocar Iniciar): START
    // (si se mandó START hace menos de 2 s, el paquete es anterior a ese START: no se repite)
    if (training.phase === 'running' && p.estado === 'esperando') {
      if (!this.inicioPedido && Date.now() - this.ultimoInicioMs > 2000) {
        this.inicioPedido = true;
        this.enviar(training.sesionEnviada ? CMD_INICIAR : CMD_NUEVA_SESION);
      }
    } else {
      this.inicioPedido = false;
    }
    onSensorPacket(p, this.last);
    this.last = p; this.lastAt = Date.now(); this.received++;
    refreshTrainingUi();
  },
  get conectado() { return !!(this.device && this.device.gatt.connected); },
  get status() {
    if (!this.soportado) return 'nosoportado';
    if (this.conectando) return 'connecting';
    if (!this.conectado) return 'off';
    if (!this.last) return 'waiting';
    return Date.now() - this.lastAt > SENSOR_TIMEOUT_MS ? 'stale' : 'live';
  },
};

function refreshTrainingUi() { if (training.ui) training.ui.refresh(); }

/* =========================================================
   SESIÓN DE ENTRENAMIENTO
   phase: idle -> running <-> paused -> resting -> confirming -> saving -> (historial)
   Vive fuera de la pantalla, así que si cambiás de pestaña
   mientras entrenás no se pierde nada.
   ========================================================= */
const training = {
  phase: 'idle',
  reps: 0, seconds: 0, setSeconds: 0, fatiga: 0, estado: 'esperando',
  pesoKg: null,
  restSeconds: 0,
  sesionEnviada: false,   // la ESP ya recibió 'N' en este entrenamiento (la referencia es de esta sesión)
  sets: [], saveIndex: 0,
  startedAt: null,
  saveError: '',
  clock: null,
  ui: null, // lo completa renderEntrenar mientras la pestaña está visible
};

// La app no muestra el porcentaje de fatiga: solo el estado y un color de verde a rojo.
function fatigaLabel(f) {
  return f >= FATIGA_UMBRAL.alta ? 'fatiga alta' : f >= FATIGA_UMBRAL.moderada ? 'fatiga moderada'
    : f >= FATIGA_UMBRAL.leve ? 'fatiga leve' : 'sin fatiga';
}
// Colores de la marca para cada nivel (los mismos que la presentación)
function fatigueColor(level) {
  const f = level * FATIGA_UMBRAL.alta;   // level = fatiga / umbral de alta
  return f >= FATIGA_UMBRAL.alta ? '#F28C28' : f >= FATIGA_UMBRAL.moderada ? '#F2B705'
    : f >= FATIGA_UMBRAL.leve ? '#C6F800' : '#8FD14F';
}
// Isotipo de MyoSignals: mancuerna cuya barra es una ráfaga de EMG
const MYO_LOGO = `<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="6" y="36" width="13" height="48" rx="3" fill="#C6F800"/><rect x="21" y="45" width="7" height="30" rx="2" fill="#C6F800"/><rect x="101" y="36" width="13" height="48" rx="3" fill="#C6F800"/><rect x="92" y="45" width="7" height="30" rx="2" fill="#C6F800"/><polyline points="28,60 37,60 43,44 50,80 58,20 66,94 73,36 79,70 84,60 92,60" fill="none" stroke="#C6F800" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="10"/></svg>`;
function fmtTime(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${m}:${ss}`;
}

// Las repeticiones se cuentan por diferencia entre paquetes, así:
// - las que la ESP contó antes de iniciar (o durante una pausa) no se suman;
// - si la ESP empieza una serie nueva, su contador vuelve a 0 y se sigue sumando bien.
function onSensorPacket(p, prev) {
  const delta = !prev ? 0 : p.serie === prev.serie ? Math.max(0, p.reps - prev.reps) : p.reps;
  if (training.phase !== 'running') return;
  training.reps += delta;
  training.estado = p.estado;
  training.fatiga = Math.max(training.fatiga, Math.round(p.fatiga));   // entero: la columna "fatiga" de Supabase es integer
}

function trainingStopLoops() {
  clearInterval(training.clock);
  training.clock = null;
}

function trainingStartLoops() {
  trainingStopLoops();
  training.clock = setInterval(() => {
    training.seconds++;
    training.setSeconds++;
    refreshTrainingUi();
  }, 1000);
}

function trainingReset() {
  trainingStopLoops();
  training.phase = 'idle';
  training.reps = 0; training.seconds = 0; training.setSeconds = 0; training.fatiga = 0; training.estado = 'esperando';
  training.pesoKg = null;
  training.restSeconds = 0;
  training.sesionEnviada = false;
  training.sets = []; training.saveIndex = 0;
  training.startedAt = null;
  training.saveError = '';
}

function trainingStartSetState() {
  training.reps = 0;
  training.setSeconds = 0;
  training.fatiga = 0;
  training.estado = sensor.last ? sensor.last.estado : 'esperando';
}

function trainingStart(weightInput) {
  if (!weightInput.checkValidity()) { weightInput.reportValidity(); return; }
  const pesoKg = weightInput.valueAsNumber;
  if (!Number.isFinite(pesoKg) || pesoKg < 0) { weightInput.reportValidity(); return; }
  trainingReset();
  training.pesoKg = pesoKg;
  trainingStartSetState();
  training.phase = 'running';
  training.startedAt = new Date().toISOString();
  trainingStartLoops();
  sensor.enviar(CMD_NUEVA_SESION);   // serie 1: la ESP calibra la referencia del entrenamiento
  render();
}
function trainingPause() { training.phase = 'paused'; trainingStopLoops(); render(); }
function trainingResume() { training.phase = 'running'; trainingStartLoops(); render(); }
function trainingStoreCurrentSet(force = false) {
  if (!force && !training.reps && !training.setSeconds) return false;
  training.sets.push({ reps: training.reps, duracion: fmtTime(training.setSeconds), fatiga: training.fatiga });
  trainingStartSetState();
  return true;
}
function trainingCompleteSet() {
  sensor.enviar(CMD_DETENER);
  trainingStoreCurrentSet(true);
  trainingStopLoops();
  training.restSeconds = 0;
  training.phase = 'resting';
  render();
  training.clock = setInterval(() => {
    training.restSeconds++;
    if (training.ui) training.ui.refresh();
  }, 1000);
}
function trainingStartNextSet() {
  trainingStopLoops();
  training.restSeconds = 0;
  training.phase = 'running';
  trainingStartLoops();
  sensor.enviar(training.sesionEnviada ? CMD_INICIAR : CMD_NUEVA_SESION);   // misma referencia que la serie 1
  render();
}
function trainingAskFinish() {
  trainingStoreCurrentSet();
  trainingStopLoops();
  training.phase = 'confirming';
  training.saveError = '';
  render();
}
function trainingKeepGoing() { training.phase = 'running'; trainingStartLoops(); render(); }
function trainingDiscard() { sensor.enviar(CMD_DETENER); trainingReset(); render(); }

async function trainingSave() {
  sensor.enviar(CMD_DETENER);
  training.phase = 'saving';
  training.saveError = '';
  render();
  const setsToSave = training.sets.length ? training.sets : [{
    reps: training.reps,
    duracion: fmtTime(training.setSeconds),
    fatiga: training.fatiga,
  }];
  while (training.saveIndex < setsToSave.length) {
    const set = setsToSave[training.saveIndex];
    const { error } = await DB.addSession(state.user.id, {
      fecha: training.startedAt,
      reps: set.reps,
      duracion: set.duracion,
      fatiga: Math.round(Number(set.fatiga) || 0),   // la columna es integer en Supabase
      peso_kg: training.pesoKg,
    });
    if (error) {
      training.phase = 'confirming';
      const savedMessage = training.saveIndex
        ? `Ya se guardaron ${training.saveIndex} series. `
        : '';
      training.saveError = savedMessage + 'No se pudo guardar la serie ' + (training.saveIndex + 1) + ': ' + error.message;
      render();
      return;
    }
    training.saveIndex++;
  }
  state.sessions = await DB.getSessions(state.user.id);
  trainingReset();
  state.tab = 'historial';
  render();
  showBanner('Sesión guardada');
}

window.addEventListener('beforeunload', (e) => {
  if (training.phase !== 'idle') { e.preventDefault(); e.returnValue = ''; }
});

/* =========================================================
   HELPERS DE ONDA (hero + dashboard)
   ========================================================= */
function drawHeroWave(canvas) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const resize = () => {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);
  };
  resize();
  let t = 0;
  const cssColor = getComputedStyle(document.documentElement).getPropertyValue('--signal').trim();
  function frame() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const freq = 0.06;
      const envelope = (Math.sin((x * 0.01) + t * 0.6) + 1) / 2;
      const y = h/2 + Math.sin(x * freq + t) * (6 + envelope * 26) * Math.sin(x*0.15+t*2)*0.3 + Math.sin(x*freq*3+t*1.7)*(4+envelope*10);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = cssColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    t += 0.04;
    canvas._raf = requestAnimationFrame(frame);
  }
  frame();
  return () => cancelAnimationFrame(canvas._raf);
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.screen === 'landing') app.appendChild(renderLanding());
  else if (state.screen === 'auth') app.appendChild(renderAuth());
  else if (state.screen === 'resetPassword') app.appendChild(renderResetPassword());
  else if (state.screen === 'profile') app.appendChild(renderProfile());
  else if (state.screen === 'dashboard') app.appendChild(renderDashboard());
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

/* ---------- Ayudas para los formularios de cuenta ---------- */
const PASS_MIN = 6;                 // mínimo de Supabase por defecto
const RECUPERAR_POR_MAIL = true;    // false: oculta "¿Olvidaste tu contraseña?" (si Supabase no puede mandar mails)
const OJO_ABIERTO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const OJO_CERRADO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 8 10 8a17.6 17.6 0 0 1-2.16 3.19M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M2 2l20 20"/></svg>`;

// Campo de contraseña con botón para verla y aviso de Bloq Mayús
function campoContrasena(label, autocomplete) {
  const input = el('input', { type: 'password', autocomplete, placeholder: '••••••••' });
  const ojo = el('button', { type: 'button', class: 'pass-toggle', 'aria-label': 'Mostrar contraseña', 'aria-pressed': 'false', html: OJO_ABIERTO });
  ojo.addEventListener('click', () => {
    const ver = input.type === 'password';
    input.type = ver ? 'text' : 'password';
    ojo.innerHTML = ver ? OJO_CERRADO : OJO_ABIERTO;
    ojo.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
    ojo.setAttribute('aria-pressed', String(ver));
    input.focus();
  });
  const mayus = el('div', { class: 'caps-warning', role: 'status' }, 'Bloq Mayús está activado');
  mayus.hidden = true;
  const revisarMayus = (e) => { if (e.getModifierState) mayus.hidden = !e.getModifierState('CapsLock'); };
  input.addEventListener('keydown', revisarMayus);
  input.addEventListener('keyup', revisarMayus);
  input.addEventListener('blur', () => { mayus.hidden = true; });
  const field = el('div', { class: 'field' }, [el('label', {}, label), el('div', { class: 'pass-wrap' }, [input, ojo]), mayus]);
  return { field, input };
}

// Contraseña nueva + repetirla, con aviso en vivo de largo y coincidencia
function camposContrasenaNueva(label) {
  const nueva = campoContrasena(label, 'new-password');
  const repetida = campoContrasena('Repetí la contraseña', 'new-password');
  const pista = el('div', { class: 'field-hint' }, `Mínimo ${PASS_MIN} caracteres.`);
  nueva.field.appendChild(pista);
  const pistaRepetida = el('div', { class: 'field-hint' }, '');
  repetida.field.appendChild(pistaRepetida);
  const revisar = () => {
    const largo = nueva.input.value.length;
    pista.className = 'field-hint' + (largo === 0 ? '' : largo >= PASS_MIN ? ' ok' : ' mal');
    pista.textContent = largo === 0 || largo >= PASS_MIN ? `Mínimo ${PASS_MIN} caracteres.` : `Faltan ${PASS_MIN - largo} caracteres.`;
    const r = repetida.input.value;
    pistaRepetida.className = 'field-hint' + (!r ? '' : r === nueva.input.value ? ' ok' : ' mal');
    pistaRepetida.textContent = !r ? '' : r === nueva.input.value ? 'Coinciden.' : 'No coinciden.';
  };
  nueva.input.addEventListener('input', revisar);
  repetida.input.addEventListener('input', revisar);
  const validar = () => {
    if (nueva.input.value.length < PASS_MIN) return `La contraseña tiene que tener al menos ${PASS_MIN} caracteres.`;
    if (nueva.input.value !== repetida.input.value) return 'Las contraseñas no coinciden.';
    return '';
  };
  return { campos: [nueva.field, repetida.field], input: nueva.input, validar };
}

// Mensajes de Supabase (en inglés) -> castellano
function traducirError(error) {
  const m = (error && error.message) || '';
  const tabla = [
    [/invalid login credentials/i, 'Email o contraseña incorrectos.'],
    [/email not confirmed/i, 'Todavía no confirmaste tu email. Revisá tu casilla y la carpeta de spam.'],
    [/password should be at least|weak password/i, `La contraseña tiene que tener al menos ${PASS_MIN} caracteres.`],
    [/unable to validate email|invalid email|email address .*invalid/i, 'El email no es válido.'],
    [/rate limit|too many requests|for security purposes/i, 'Hubo demasiados intentos seguidos. Esperá un minuto y volvé a probar.'],
    [/failed to fetch|networkerror|load failed/i, 'No hay conexión. Revisá internet y volvé a probar.'],
    [/signups? not allowed|signup is disabled/i, 'Por ahora no se pueden crear cuentas nuevas.'],
    [/different from the old/i, 'La contraseña nueva tiene que ser distinta a la anterior.'],
    [/reauthenticat|nonce/i, 'Por seguridad, cerrá sesión, volvé a entrar y probá de nuevo.'],
    [/error sending|smtp|email.*disabled/i, 'No pudimos mandar el mail en este momento. Probá más tarde.'],
  ];
  for (const [re, texto] of tabla) if (re.test(m)) return texto;
  return m || 'Algo salió mal. Probá de nuevo.';
}

// Pone el foco en el primer campo vacío (sin hacer saltar la pantalla en el celular)
function enfocarPrimerVacio(inputs) {
  if (window.matchMedia('(pointer: coarse)').matches) return;
  requestAnimationFrame(() => { const v = inputs.find(i => !i.value); if (v) v.focus(); });
}

/* ---------- Auth ---------- */
function renderAuth() {
  if (state.authMode === 'forgot') return renderForgotPassword();
  const wrap = el('div', { class: 'screen' });
  const isSignup = state.authMode === 'signup';

  wrap.appendChild(el('div', { class: 'back-row' }, [
    el('button', { class: 'back-btn', 'aria-label': 'Volver', onclick: () => { state.screen = 'landing'; render(); }, html: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>` }),
  ]));

  wrap.appendChild(el('h2', { class: 'page-title' }, isSignup ? 'Creá tu cuenta' : 'Iniciá sesión'));
  wrap.appendChild(el('p', { class: 'page-sub' }, isSignup ? 'Vas a poder calibrar tu perfil y guardar tu historial de entrenamiento.' : 'Ingresá con tu email y contraseña.'));

  // El email se conserva si hay un error (antes se borraba al volver a dibujar la pantalla)
  const emailInput = el('input', { type: 'email', autocomplete: 'email', placeholder: 'vos@ejemplo.com', value: state.authEmail || '' });
  const nueva = isSignup ? camposContrasenaNueva('Contraseña') : null;
  const actual = isSignup ? null : campoContrasena('Contraseña', 'current-password');
  const passInput = isSignup ? nueva.input : actual.input;

  const form = el('form', { novalidate: 'novalidate' }, [
    el('div', { class: 'field' }, [el('label', {}, 'Email'), emailInput]),
    ...(isSignup ? nueva.campos : [actual.field]),
  ]);

  const errorBox = el('div', { class: 'error-text', role: 'alert', 'aria-live': 'polite' }, state.authError || '');
  if (!state.authError) errorBox.style.display = 'none';
  const infoBox = el('div', { class: 'profile-feedback success', role: 'status', 'aria-live': 'polite' }, state.authInfo || '');
  if (state.authInfo) infoBox.style.display = 'block';

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = emailInput.value.trim().toLowerCase();
    const pass = passInput.value;
    state.authEmail = email;
    state.authInfo = '';
    if (!email || !pass) { state.authError = 'Completá el email y la contraseña.'; render(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { state.authError = 'El email no es válido.'; render(); return; }
    if (isSignup) {
      const problema = nueva.validar();
      if (problema) { state.authError = problema; render(); return; }
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Un momento...';

    if (isSignup) {
      const { data, error } = await DB.signUp(email, pass);
      if (error) {
        const accountExists = error.code === 'user_already_exists' || /already (registered|exists)/i.test(error.message || '');
        state.authError = accountExists
          ? 'Ya existe una cuenta con ese email. Iniciá sesión con tu cuenta.'
          : traducirError(error);
        render();
        return;
      }
      if (data.user?.identities?.length === 0) {
        state.authError = 'Ya existe una cuenta con ese email. Iniciá sesión con tu cuenta.';
        render();
        return;
      }
      if (!data.session) {
        // El proyecto tiene "Confirm email" activado: hay que confirmar por mail antes de poder entrar.
        state.authError = '';
        state.authMode = 'login';
        state.screen = 'auth';
        state.authInfo = 'Cuenta creada. Revisá tu email (y la carpeta de spam) para confirmarla antes de iniciar sesión.';
        render();
        return;
      }
      state.authEmail = ''; state.authError = '';
      state.user = { id: data.user.id, email: data.user.email, profile: null };
      state.screen = 'profile';
      render();
    } else {
      const { data, error } = await DB.signIn(email, pass);
      if (error) { state.authError = traducirError(error); render(); return; }
      state.authEmail = ''; state.authError = '';
      const profile = await DB.getProfile(data.user.id);
      state.user = { id: data.user.id, email: data.user.email, profile };
      if (profile) state.sessions = await DB.getSessions(data.user.id);
      state.screen = profile ? 'dashboard' : 'profile';
      render();
    }
  });

  const submitBtn = el('button', { class: 'btn-primary', type: 'submit', style: 'margin-top:6px' }, isSignup ? 'Crear cuenta' : 'Ingresar');
  form.appendChild(submitBtn);

  wrap.appendChild(form);
  wrap.appendChild(errorBox);
  wrap.appendChild(infoBox);
  enfocarPrimerVacio([emailInput, passInput]);
  if (!isSignup && RECUPERAR_POR_MAIL) {
    wrap.appendChild(el('button', {
      class: 'btn-ghost', style: 'margin-top:8px; display:block',
      onclick: () => { state.authEmail = emailInput.value.trim(); state.authMode = 'forgot'; state.authError = ''; state.authInfo = ''; render(); }
    }, '¿Olvidaste tu contraseña?'));
  }
  wrap.appendChild(el('button', {
    class: 'btn-ghost', style: isSignup ? 'margin-top:16px' : 'margin-top:4px',
    onclick: () => { state.authEmail = emailInput.value.trim(); state.authMode = isSignup ? 'login' : 'signup'; state.authError = ''; state.authInfo = ''; render(); }
  }, isSignup ? '¿Ya tenés cuenta? Iniciá sesión' : '¿No tenés cuenta? Creá una'));

  return wrap;
}

/* ---------- Olvidé mi contraseña: pedir el link por mail ---------- */
function renderForgotPassword() {
  const wrap = el('div', { class: 'screen' });
  const backToLogin = () => { state.authMode = 'login'; state.authError = ''; state.authInfo = ''; render(); };

  wrap.appendChild(el('div', { class: 'back-row' }, [
    el('button', { class: 'back-btn', 'aria-label': 'Volver', onclick: backToLogin, html: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>` }),
  ]));
  wrap.appendChild(el('h2', { class: 'page-title' }, 'Recuperar contraseña'));
  wrap.appendChild(el('p', { class: 'page-sub' }, 'Ingresá tu email y te mandamos un link para elegir una contraseña nueva.'));

  const emailInput = el('input', { type: 'email', autocomplete: 'email', placeholder: 'vos@ejemplo.com', value: state.authEmail || '' });
  const submitBtn = el('button', { class: 'btn-primary', type: 'submit', style: 'margin-top:6px' }, 'Enviar link');
  const form = el('form', {}, [
    el('div', { class: 'field' }, [el('label', {}, 'Email'), emailInput]),
    submitBtn,
  ]);

  const errorBox = el('div', { class: 'error-text', role: 'alert', 'aria-live': 'polite' }, state.authError || '');
  if (!state.authError) errorBox.style.display = 'none';
  const infoBox = el('div', { class: 'profile-feedback success', role: 'status', 'aria-live': 'polite' }, state.authInfo || '');
  if (state.authInfo) infoBox.style.display = 'block';

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = emailInput.value.trim().toLowerCase();
    state.authEmail = email;
    if (!email) { state.authError = 'Ingresá tu email.'; state.authInfo = ''; render(); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    const { error } = await DB.sendPasswordReset(email);
    if (error) {
      state.authError = /rate limit|seconds/i.test(error.message || '')
        ? 'Pediste un link hace poco. Esperá un minuto y volvé a intentar.'
        : traducirError(error);
      state.authInfo = '';
    } else {
      // No confirmamos si el email existe o no, para no revelar qué cuentas están registradas.
      state.authError = '';
      state.authInfo = 'Si hay una cuenta con ese email, te llegó un link para restablecer la contraseña. Revisá también la carpeta de spam.';
    }
    render();
  });

  wrap.appendChild(form);
  wrap.appendChild(errorBox);
  wrap.appendChild(infoBox);
  wrap.appendChild(el('button', { class: 'btn-ghost', style: 'margin-top:16px', onclick: backToLogin }, 'Volver a iniciar sesión'));
  return wrap;
}

/* ---------- Elegir contraseña nueva (después de abrir el link del mail) ---------- */
function renderResetPassword() {
  const wrap = el('div', { class: 'screen' });

  wrap.appendChild(el('h2', { class: 'page-title' }, 'Elegí una contraseña nueva'));
  wrap.appendChild(el('p', { class: 'page-sub' }, `Para la cuenta ${state.user?.email || ''}.`));

  const nueva = camposContrasenaNueva('Contraseña nueva');
  const submitBtn = el('button', { class: 'btn-primary', type: 'submit', style: 'margin-top:6px' }, 'Guardar contraseña');
  const form = el('form', { novalidate: 'novalidate' }, [...nueva.campos, submitBtn]);

  const errorBox = el('div', { class: 'error-text', role: 'alert', 'aria-live': 'polite' }, state.authError || '');
  if (!state.authError) errorBox.style.display = 'none';

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const pass = nueva.input.value;
    const problema = nueva.validar();
    if (problema) { state.authError = problema; render(); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Guardando...';
    const { error } = await DB.updatePassword(pass);
    if (error) {
      state.authError = traducirError(error);
      render();
      return;
    }

    // Ya quedó logueado con la contraseña nueva: lo mandamos a su cuenta.
    state.authError = '';
    state.recoveringPassword = false;
    const profile = await DB.getProfile(state.user.id);
    state.user.profile = profile || null;
    if (profile) state.sessions = await DB.getSessions(state.user.id);
    state.screen = profile ? 'dashboard' : 'profile';
    render();
    showBanner('Contraseña actualizada');
  });

  wrap.appendChild(form);
  wrap.appendChild(errorBox);
  wrap.appendChild(el('button', {
    class: 'btn-ghost', style: 'margin-top:16px',
    onclick: async () => {
      await DB.signOut();
      state.user = null; state.authError = ''; state.recoveringPassword = false;
      state.screen = 'landing';
      render();
    }
  }, 'Cancelar'));
  return wrap;
}

/* ---------- Profile setup and editing ---------- */
function profilePhotoKey(userId) { return 'curl-emg-profile-photo-' + userId; }

function getProfilePhoto(userId) {
  try { return localStorage.getItem(profilePhotoKey(userId)); }
  catch { return null; }
}

function compressProfilePhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen.'));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error('El archivo no es una imagen válida.'));
      image.onload = () => {
        const scale = Math.min(1, 512 / Math.max(image.width, image.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderProfile(isEditing = false) {
  const wrap = el('div', { class: isEditing ? 'profile-editor' : 'screen' });
