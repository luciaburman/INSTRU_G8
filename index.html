<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Curl EMG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #F1F4EE;
    --surface: #FCFDFB;
    --surface-2: #E7ECE3;
    --border: #D2DCCF;
    --text: #17251D;
    --text-secondary: #536457;
    --text-muted: #78867B;
    --signal: #B7E449;
    --signal-rgb: 183,228,73;
    --signal-glow: rgba(183,228,73,0.2);
    --amber: #9A5B11;
    --amber-bg: #F9EBD4;
    --red: #B43D36;
    --red-bg: #F8E4DF;
    --radius: 8px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111812;
      --surface: #1A241C;
      --surface-2: #232F25;
      --border: #344337;
      --text: #EFF5E8;
      --text-secondary: #B0BEAD;
      --text-muted: #849383;
      --signal: #C7F36A;
      --signal-rgb: 199,243,106;
      --signal-glow: rgba(199,243,106,0.2);
      --amber: #F1B45B;
      --amber-bg: #382B18;
      --red: #F07869;
      --red-bg: #38201D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111812;
    --surface: #1A241C;
    --surface-2: #232F25;
    --border: #344337;
    --text: #EFF5E8;
    --text-secondary: #B0BEAD;
    --text-muted: #849383;
    --signal: #C7F36A;
    --signal-rgb: 199,243,106;
    --signal-glow: rgba(199,243,106,0.2);
    --amber: #F1B45B;
    --amber-bg: #382B18;
    --red: #F07869;
    --red-bg: #38201D;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hero-title, .page-title { font-family: 'Space Grotesk', 'DM Sans', sans-serif; letter-spacing: 0; }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }
  .screen.wide { max-width: 640px; }

  /* ---------- Landing ---------- */
  .landing { justify-content: space-between; min-height: 100vh; padding-top: env(safe-area-inset-top, 24px); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--signal-glow); display: flex; align-items: center; justify-content: center; }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .hero-wave { width: 100%; height: 140px; margin: 28px 0 8px; }
  .hero-title { font-size: 34px; line-height: 1.12; font-weight: 700; margin: 0 0 14px; }
  .hero-sub { font-size: 15px; line-height: 1.55; color: var(--text-secondary); margin: 0 0 28px; max-width: 40ch; }
  .cta-row { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Buttons & inputs ---------- */
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    background: var(--signal); color: #06140E; font-weight: 600; font-size: 15px;
    padding: 14px 18px; border-radius: 10px; width: 100%;
  }
  .btn-secondary {
    background: transparent; color: var(--text); font-weight: 500; font-size: 15px;
    padding: 14px 18px; border-radius: 10px; width: 100%; border: 1px solid var(--border);
  }
  .btn-ghost { background: none; color: var(--text-secondary); font-size: 14px; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size: 15px; font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
  .profile-editor { width: 100%; max-width: 760px; }
  .profile-photo-row { display: flex; align-items: center; gap: 18px; margin: 20px 0 26px; }
  .profile-avatar { width: 88px; height: 88px; flex: 0 0 88px; overflow: hidden; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--text-secondary); font-size: 30px; font-weight: 600; }
  .profile-avatar-image { width: 100%; height: 100%; object-fit: cover; }
  .profile-photo-details { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .profile-photo-details p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .photo-picker { position: relative; display: inline-flex; width: auto; padding: 10px 14px; }
  .photo-picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .profile-fields { display: grid; grid-template-columns: 1fr; }
  .profile-feedback { display: none; margin: 12px 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
  .profile-feedback.error { color: var(--red); background: var(--red-bg); border: 1px solid var(--red); }
  .profile-feedback.success { color: var(--text); background: var(--signal-glow); border: 1px solid var(--signal); }
  .error-text {
    color: var(--red); background: var(--red-bg); border: 1px solid var(--red);
    border-radius: 8px; font-size: 13px; line-height: 1.45; margin: 12px 0 16px; padding: 10px 12px;
  }

  /* ---------- Auth / Profile ---------- */
  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .back-btn { background: none; padding: 6px; color: var(--text-secondary); }
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  .page-sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 24px; }

  /* ---------- Dashboard shell ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .user-avatar { width: 28px; height: 28px; flex: 0 0 28px; object-fit: cover; border-radius: 50%; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px var(--signal-glow); }
  .logout-link { font-size: 13px; color: var(--text-secondary); background: none; text-decoration: underline; text-underline-offset: 2px; }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 22px; }
  .tab-btn { flex: 1; background: none; padding: 9px 4px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .tab-btn.active { background: var(--surface); color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .metrics-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .metric { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px; text-align: left; }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: none; }
  .metric-value { font-size: 28px; font-weight: 600; line-height: 1; }

  .fatigue-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .fatigue-low { background: var(--surface-2); color: var(--text-secondary); }
  .fatigue-mid { background: var(--amber-bg); color: var(--amber); }
  .fatigue-high { background: var(--red-bg); color: var(--red); }

  .bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--signal); border-radius: 4px; transition: width 0.08s linear; }

  .controls-row { display: flex; gap: 10px; margin-top: 4px; }
  .controls-row button { flex: 1; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600; }

  .plan-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .plan-item:last-child { border-bottom: none; }
  .plan-item-label { font-size: 14px; color: var(--text-secondary); }
  .plan-item-value { font-size: 15px; font-weight: 600; }

  .session-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .session-row:last-child { border-bottom: none; }
  .session-date { font-size: 14px; }
  .session-stats { font-size: 13px; color: var(--text-secondary); }
  .empty-state { text-align: center; padding: 40px 10px; color: var(--text-muted); font-size: 14px; }

  .note {
    font-size: 12px; color: var(--text-muted); background: var(--surface-2);
    border-radius: 10px; padding: 12px 14px; line-height: 1.5; margin-top: 6px;
  }
  a, a:visited { color: inherit; }

  .verified-banner {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%);
    background: var(--signal); color: #06140E; font-weight: 600; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18); z-index: 999;
    animation: banner-in 0.25s ease-out;
  }
  @keyframes banner-in { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .verified-banner.error { background: var(--red); color: #fff; }
  .phase-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; background: var(--surface-2); color: var(--text-secondary); }
  .phase-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
  .phase-running { color: var(--text); }
  .phase-running::before { background: var(--signal); box-shadow: 0 0 0 4px var(--signal-glow); animation: live-pulse 1.8s ease-in-out infinite; }
  .phase-paused, .phase-confirming { background: var(--amber-bg); color: var(--amber); }
  .phase-paused::before, .phase-confirming::before { background: var(--amber); }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); margin-left: 6px; vertical-align: middle; }
  button:disabled { opacity: 0.55; cursor: default; }
  .training-view { min-width: 0; }
  .training-view > .phase-pill { margin-bottom: 12px; }
  .set-progress { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 14px; border-left: 3px solid var(--signal); border-radius: 6px; background: var(--signal-glow); }
  .set-progress strong { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
  .set-progress span { color: var(--text-secondary); font-size: 13px; }
  .rest-progress { min-height: 132px; padding: 20px 24px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--signal); box-shadow: 0 8px 24px var(--signal-glow); }
  .rest-copy { display: flex; flex-direction: column; gap: 5px; }
  .rest-copy .rest-kicker { color: var(--text-secondary); font-size: 11px; font-weight: 700; }
  .rest-copy strong { color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 18px; }
  .rest-copy .rest-caption { color: var(--text-muted); font-size: 12px; }
  .rest-progress .rest-timer { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .set-complete-btn { margin: 0 0 10px; }
  .completed-set-list { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .completed-set-heading, .completed-set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .completed-set-heading { margin-bottom: 8px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .completed-set-row { padding: 7px 0; border-top: 1px solid var(--border); font-size: 12px; }
  .completed-set-row span:first-child { color: var(--text); font-weight: 600; }
  .completed-set-row span:last-child { color: var(--text-secondary); text-align: right; }
  .session-group { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .session-group:last-child { border-bottom: none; }
  .session-group-heading { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; font-weight: 600; }
  .session-set-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; color: var(--text-secondary); font-size: 13px; }
  .signal-card { overflow: hidden; }
  .signal-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 14px; color: var(--text-secondary); font-size: 13px; }
  .signal-heading strong { color: var(--text); font-weight: 600; }
  .signal-canvas { width: 100%; height: 170px; display: block; border-radius: 6px; }
  .activation-card { background: var(--surface-2); }
  .activation-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; color: var(--text-secondary); font-size: 13px; }
  .activation-heading .mono { color: var(--text); font-size: 16px; font-weight: 600; }
  .training-start-card { padding: 28px; }
  .training-start-card .page-title { font-size: 24px; }
  .training-start-card .btn-primary { margin-top: 4px; }
  .training-note { line-height: 1.6; }
  .controls-row button { transition: transform 0.18s ease, filter 0.18s ease; }
  @keyframes live-pulse { 50% { box-shadow: 0 0 0 7px rgba(var(--signal-rgb), 0.08); } }

  @media (hover: hover) {
    button:not(:disabled):hover { filter: brightness(1.04); }
    .controls-row button:not(:disabled):hover { transform: translateY(-1px); }
  }

  @media (min-width: 900px) {
    .screen { max-width: 560px; padding: 44px 32px 56px; }
    .screen:not(.wide):not(.landing) { justify-content: center; }
    .screen.wide { max-width: 1120px; padding: 36px 48px 56px; }
    .screen.wide .card { padding: 24px; }
    .screen.wide .metrics-row { gap: 16px; }
    .screen.wide .metric { padding: 20px 16px; }
    .screen.wide .metric-value { font-size: 30px; }
    .training-view { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.75fr); gap: 14px 20px; align-items: start; }
    .training-view > .phase-pill, .training-view > .set-progress, .training-view > .metrics-row, .training-view > .set-complete-btn, .training-view > .controls-row, .training-view > .training-note { grid-column: 1 / -1; }
    .training-view > .signal-card { grid-column: 1; margin: 0; }
    .training-view > .activation-card { grid-column: 2; align-self: stretch; margin: 0; }
    .training-view > .confirm-card { grid-column: 1 / -1; margin: 0; }
    .signal-canvas { height: 230px; }
    .training-view > .training-start-card { grid-column: 1; margin: 0; }
    .training-view > .training-note.start-note { grid-column: 2; align-self: stretch; margin: 0; display: flex; align-items: center; }
    .profile-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }

    .landing {
      display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      grid-template-rows: auto 1fr; column-gap: 64px; align-items: center;
      max-width: 1200px; padding: 32px 56px 48px;
    }
    .landing > :first-child { grid-column: 1 / -1; align-self: start; }
    .landing > :nth-child(2) { grid-column: 1; grid-row: 2; }
    .landing > :nth-child(3) { grid-column: 2; grid-row: 2; align-self: center; width: 100%; max-width: 340px; }
    .hero-wave { height: 180px; margin: 32px 0 16px; }
    .hero-title { max-width: 16ch; font-size: 44px; }
    .hero-sub { font-size: 16px; }
    .cta-row { gap: 12px; }
  }

  @media (max-width: 480px) {
    .session-row { align-items: flex-start; flex-direction: column; gap: 6px; }
    .session-stats { overflow-wrap: anywhere; }
    .metric { padding: 14px 10px; }
    .metric-value { font-size: 24px; }
    .rest-progress { min-height: 112px; padding: 16px; }
    .rest-copy strong { font-size: 16px; }
    .rest-progress .rest-timer { font-size: 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONEXIÓN REAL A SUPABASE
   ========================================================= */
const SUPABASE_URL = 'https://lhzcprnlfbvjjswyjafp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoemNwcm5sZmJ2ampzd3lqYWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNjg2ODksImV4cCI6MjEwNTk0NDY4OX0.Yud1fajPzlWdYxxrVV-oEL_sLUxjlnIP1T5PdT72l0A';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DB = {
  async signUp(email, password) {
    return await supa.auth.signUp({ email, password });
  },
  async signIn(email, password) {
    return await supa.auth.signInWithPassword({ email, password });
  },
  async signOut() {
    await supa.auth.signOut();
  },
  async getCurrentUser() {
    const { data } = await supa.auth.getUser();
    return data.user || null;
  },
  async getProfile(userId) {
    const { data } = await supa.from('profiles').select('*').eq('id', userId).maybeSingle();
    return data;
  },
  async saveProfile(userId, profile) {
    const { error } = await supa.from('profiles').upsert({ id: userId, ...profile });
    return { error };
  },
  async getSessions(userId) {
    const { data } = await supa.from('sessions').select('*').eq('user_id', userId).order('fecha', { ascending: false });
    return data || [];
  },
  async addSession(userId, session) {
    const { error } = await supa.from('sessions').insert({ user_id: userId, ...session });
    return { error };
  },
  // Lista para cuando el ESP32 empiece a escribir en emg_readings de verdad.
  subscribeToEMG(userId, onSample) {
    return supa
      .channel('emg-live-' + userId)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'emg_readings', filter: `user_id=eq.${userId}` },
        (payload) => onSample(payload.new.biceps, payload.new.fatiga)
      )
      .subscribe();
  },
};

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const state = {
  screen: 'landing',   // landing | auth | profile | dashboard
  authMode: 'login',   // login | signup
  authError: '',
  user: null,
  tab: 'entrenar',      // entrenar | plan | historial
};

async function boot() {
  // Supabase redirige acá después de confirmar el mail, agregando datos
  // en el hash de la URL (#access_token=...&type=signup). Los detectamos
  // antes de que el cliente los "limpie" automáticamente.
  const hash = window.location.hash;
  if (hash.includes('type=signup') || hash.includes('type=email_change') || hash.includes('type=recovery')) {
    state.justVerified = true;
  }
  // limpiamos la URL para que no quede el token visible ni se re-muestre el cartel al refrescar
  if (state.justVerified) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  // getSession() espera a que el cliente termine de procesar la URL, a diferencia de getUser()
  const { data: { session } } = await supa.auth.getSession();
  if (session?.user) {
    const profile = await DB.getProfile(session.user.id);
    state.user = { id: session.user.id, email: session.user.email, profile: profile || null };
    state.screen = profile ? 'dashboard' : 'profile';
    if (profile) state.sessions = await DB.getSessions(session.user.id);
  }
  render();

  if (state.justVerified) {
    showVerifiedBanner();
    state.justVerified = false;
  }
}

function showBanner(text, isError) {
  const banner = el('div', { class: 'verified-banner' + (isError ? ' error' : '') }, [
    el('span', { html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>` }),
    el('span', {}, text),
  ]);
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 3500);
}
function showVerifiedBanner() { showBanner('Cuenta verificada'); }

/* =========================================================
   GENERADOR DE PLAN — reglas, sin IA externa
   ========================================================= */
function generarPlan(profile) {
  const { nivel, objetivo } = profile;
  const tablas = {
    hipertrofia: {
      principiante: { series: 3, repeticiones: '10-12', descanso: '60s', frecuencia: '2x por semana' },
      intermedio:   { series: 4, repeticiones: '8-10',  descanso: '75s', frecuencia: '3x por semana' },
      avanzado:     { series: 5, repeticiones: '6-8',   descanso: '90s', frecuencia: '3-4x por semana' },
    },
    resistencia: {
      principiante: { series: 3, repeticiones: '15-18', descanso: '30s', frecuencia: '2x por semana' },
      intermedio:   { series: 3, repeticiones: '18-22', descanso: '30s', frecuencia: '3x por semana' },
      avanzado:     { series: 4, repeticiones: '20-25', descanso: '25s', frecuencia: '3-4x por semana' },
    },
    fuerza: {
      principiante: { series: 3, repeticiones: '5-6',  descanso: '120s', frecuencia: '2x por semana' },
      intermedio:   { series: 4, repeticiones: '4-6',  descanso: '150s', frecuencia: '2-3x por semana' },
      avanzado:     { series: 5, repeticiones: '3-5',  descanso: '180s', frecuencia: '3x por semana' },
    },
  };
  return (tablas[objetivo] && tablas[objetivo][nivel]) || tablas.hipertrofia.principiante;
}

/* =========================================================
   FUENTE DE SEÑAL EMG
   -----------------------------------------------------------
   Hoy genera una señal simulada. Cuando el ESP32 esté mandando datos
   reales a Supabase, solo hay que reemplazar el contenido de start():
     const ch = DB.subscribeToEMG(state.user.id, (biceps) => onSample(biceps));
     return () => supa.removeChannel(ch);
   El resto de la app no cambia.
   ========================================================= */
const emgSource = {
  simT: -0.625, // arranca con el músculo relajado
  start(onSample) {
    const id = setInterval(() => {
      emgSource.simT += 0.05;
      const cycle = (Math.sin(emgSource.simT * 2 * Math.PI / 2.5) + 1) / 2;
      const b = cycle * (0.92 + Math.random() * 0.08);
      onSample(Math.min(1, Math.max(0, b)));
    }, 50);
    return () => clearInterval(id);
  },
};

/* =========================================================
   SESIÓN DE ENTRENAMIENTO
   phase: idle -> running <-> paused -> confirming -> saving -> (historial)
   Vive fuera de la pantalla, así que si cambiás de pestaña
   mientras entrenás no se pierde nada.
   ========================================================= */
const training = {
  phase: 'idle',
  reps: 0, seconds: 0, setSeconds: 0, fatiga: 0,
  restSeconds: 0,
  sets: [], saveIndex: 0,
  repState: 'relajado',
  points: [],
  startedAt: null,
  saveError: '',
  clock: null, stopSource: null,
  ui: null, // lo completa renderEntrenar mientras la pestaña está visible
};

const REP_UP = 0.5, REP_DOWN = 0.35;

function fmtTime(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${m}:${ss}`;
}

function trainingStopLoops() {
  clearInterval(training.clock);
  training.clock = null;
  if (training.stopSource) { training.stopSource(); training.stopSource = null; }
}

function trainingStartLoops() {
  trainingStopLoops();
  training.clock = setInterval(() => {
    training.seconds++;
    training.setSeconds++;
    if (training.ui) training.ui.refresh();
  }, 1000);
  training.stopSource = emgSource.start(onEmgSample);
}

function trainingReset() {
  trainingStopLoops();
  training.phase = 'idle';
  training.reps = 0; training.seconds = 0; training.setSeconds = 0; training.fatiga = 0;
  training.restSeconds = 0;
  training.sets = []; training.saveIndex = 0;
  training.repState = 'relajado';
  training.points = [];
  training.startedAt = null;
  training.saveError = '';
  emgSource.simT = -0.625;
}

function onEmgSample(b) {
  training.points.push(b);
  if (training.points.length > 120) training.points.shift();

  if (training.repState === 'relajado' && b > REP_UP) {
    training.repState = 'contraido';
  } else if (training.repState === 'contraido' && b < REP_DOWN) {
    training.repState = 'relajado';
    training.reps++;
    training.fatiga = Math.min(100, training.reps * 4); // placeholder hasta tener el modelo de ML
  }
  if (training.ui) training.ui.refresh();
}

function trainingStart() {
  trainingReset();
  training.phase = 'running';
  training.startedAt = new Date().toISOString();
  trainingStartLoops();
  render();
}
function trainingPause() { training.phase = 'paused'; trainingStopLoops(); render(); }
function trainingResume() { training.phase = 'running'; trainingStartLoops(); render(); }
function trainingStoreCurrentSet(force = false) {
  if (!force && !training.reps && !training.setSeconds) return false;
  training.sets.push({ reps: training.reps, duracion: fmtTime(training.setSeconds), fatiga: training.fatiga });
  training.reps = 0;
  training.setSeconds = 0;
  training.fatiga = 0;
  training.repState = 'relajado';
  training.points = [];
  emgSource.simT = -0.625;
  return true;
}
function trainingCompleteSet() {
  trainingStoreCurrentSet(true);
  trainingStopLoops();
  training.restSeconds = 0;
  training.phase = 'resting';
  render();
  training.clock = setInterval(() => {
    training.restSeconds++;
    if (training.ui) training.ui.refresh();
  }, 1000);
}
function trainingStartNextSet() {
  trainingStopLoops();
  training.restSeconds = 0;
  training.phase = 'running';
  trainingStartLoops();
  render();
}
function trainingAskFinish() {
  trainingStoreCurrentSet();
  trainingStopLoops();
  training.phase = 'confirming';
  training.saveError = '';
  render();
}
function trainingKeepGoing() { training.phase = 'running'; trainingStartLoops(); render(); }
function trainingDiscard() { trainingReset(); render(); }

async function trainingSave() {
  training.phase = 'saving';
  training.saveError = '';
  render();
  const setsToSave = training.sets.length ? training.sets : [{
    reps: training.reps,
    duracion: fmtTime(training.setSeconds),
    fatiga: training.fatiga,
  }];
  while (training.saveIndex < setsToSave.length) {
    const set = setsToSave[training.saveIndex];
    const { error } = await DB.addSession(state.user.id, {
      fecha: training.startedAt,
      reps: set.reps,
      duracion: set.duracion,
      fatiga: set.fatiga,
    });
    if (error) {
      training.phase = 'confirming';
      const savedMessage = training.saveIndex
        ? `Ya se guardaron ${training.saveIndex} series. `
        : '';
      training.saveError = savedMessage + 'No se pudo guardar la serie ' + (training.saveIndex + 1) + ': ' + error.message;
      render();
      return;
    }
    training.saveIndex++;
  }
  state.sessions = await DB.getSessions(state.user.id);
  trainingReset();
  state.tab = 'historial';
  render();
  showBanner('Sesión guardada');
}

window.addEventListener('beforeunload', (e) => {
  if (training.phase !== 'idle') { e.preventDefault(); e.returnValue = ''; }
});

/* =========================================================
   HELPERS DE ONDA (hero + dashboard)
   ========================================================= */
function drawHeroWave(canvas) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const resize = () => {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);
  };
  resize();
  let t = 0;
  const cssColor = getComputedStyle(document.documentElement).getPropertyValue('--signal').trim();
  function frame() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const freq = 0.06;
      const envelope = (Math.sin((x * 0.01) + t * 0.6) + 1) / 2;
      const y = h/2 + Math.sin(x * freq + t) * (6 + envelope * 26) * Math.sin(x*0.15+t*2)*0.3 + Math.sin(x*freq*3+t*1.7)*(4+envelope*10);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = cssColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    t += 0.04;
    canvas._raf = requestAnimationFrame(frame);
  }
  frame();
  return () => cancelAnimationFrame(canvas._raf);
}

   RENDER
   ========================================================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.screen === 'landing') app.appendChild(renderLanding());
  else if (state.screen === 'auth') app.appendChild(renderAuth());
  else if (state.screen === 'profile') app.appendChild(renderProfile());
  else if (state.screen === 'dashboard') app.appendChild(renderDashboard());
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

/* ---------- Profile setup and editing ---------- */
function profilePhotoKey(userId) { return 'curl-emg-profile-photo-' + userId; }

function getProfilePhoto(userId) {
  try { return localStorage.getItem(profilePhotoKey(userId)); }
  catch { return null; }
}

function compressProfilePhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen.'));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error('El archivo no es una imagen válida.'));
      image.onload = () => {
        const scale = Math.min(1, 512 / Math.max(image.width, image.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderHistorialTab() {
  const sessions = state.sessions || [];
  if (!sessions.length) {
    return el('div', { class: 'card' }, [el('div', { class: 'empty-state' }, 'Todavía no completaste ninguna sesión. Andá a la pestaña "Entrenar" para arrancar.')]);
  }
  const groups = new Map();
  sessions.forEach((session) => {
    if (!groups.has(session.fecha)) groups.set(session.fecha, []);
    groups.get(session.fecha).push(session);
  });
  const rows = Array.from(groups.entries()).map(([fecha, sets]) => {
    const totalReps = sets.reduce((total, set) => total + (Number(set.reps) || 0), 0);
    const dateLabel = new Date(fecha).toLocaleString('es-AR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    if (sets.length === 1) {
      const set = sets[0];
      return el('div', { class: 'session-group' }, [
        el('div', { class: 'session-group-heading' }, [
          el('span', { class: 'session-date' }, dateLabel),
          el('span', { class: 'session-stats mono' }, `${totalReps} reps · ${set.duracion} · fatiga ${set.fatiga}%`),
        ]),
      ]);
    }
    return el('div', { class: 'session-group' }, [
      el('div', { class: 'session-group-heading' }, [
        el('span', { class: 'session-date' }, dateLabel),
        el('span', { class: 'session-stats mono' }, `${sets.length} ${sets.length === 1 ? 'serie' : 'series'} · ${totalReps} reps`),
      ]),
      ...sets.map((set, index) => el('div', { class: 'session-set-row' }, [
        el('span', {}, `Serie ${index + 1}`),
        el('span', { class: 'mono' }, `${set.reps} reps · ${set.duracion} · fatiga ${set.fatiga}%`),
      ])),
    ]);
  });
  return el('div', { class: 'card' }, rows);
}

function renderEntrenar() {
  const box = el('div', { class: 'training-view' });
  training.ui = null;

  // ---------- Antes de empezar ----------
  if (training.phase === 'idle') {
    const plan = generarPlan(state.user.profile);
    box.appendChild(el('div', { class: 'card training-start-card' }, [
      el('h2', { class: 'page-title', style: 'font-size:18px' }, 'Listo para entrenar'),
      el('p', { class: 'page-sub', style: 'margin-bottom:18px' },
        `Tu plan: ${plan.series} series de ${plan.repeticiones} repeticiones, con ${plan.descanso} de descanso.`),
      el('button', { class: 'btn-primary', onclick: trainingStart }, 'Iniciar entrenamiento'),
    ]));
    box.appendChild(el('div', { class: 'note training-note start-note' },
      'Al terminar, la sesión se guarda en tu historial. La señal EMG es simulada hasta que el circuito esté conectado.'));
    return box;
  }

  // ---------- Sesión en curso / pausa / confirmación ----------
  const phaseLabels = { running: 'En curso', paused: 'En pausa', resting: 'Descanso', confirming: 'En pausa', saving: 'Guardando...' };
  box.appendChild(el('div', { class: 'phase-pill phase-' + training.phase }, phaseLabels[training.phase]));

  const plannedSets = generarPlan(state.user.profile).series;
  const nextSetNumber = training.sets.length + 1;
  const isResting = training.phase === 'resting';
  const restTimerValue = el('span', { class: 'rest-timer' }, fmtTime(training.restSeconds));
  const isPaused = training.phase === 'paused';
  box.appendChild(isResting
    ? el('div', { class: 'set-progress rest-progress', role: 'timer', 'aria-live': 'off' }, [
        el('div', { class: 'rest-copy' }, [
          el('span', { class: 'rest-kicker' }, `Serie ${training.sets.length} completada`),
          el('strong', {}, ` TIEMPO DE DESCANSO`),
          el('span', { class: 'rest-caption' }, 'Segundos transcurridos'),
        ]),
        restTimerValue,
      ])
    : el('div', { class: 'set-progress' }, [
        el('strong', {}, `Serie ${nextSetNumber} de ${plannedSets} · ${isPaused ? 'en pausa' : 'en curso'}`),
        el('span', {}, `${training.sets.length} ${training.sets.length === 1 ? 'serie completada' : 'series completadas'}`),
      ]));

  const repValue = el('div', { class: 'metric-value mono' }, String(training.reps));
  const timeValue = el('div', { class: 'metric-value mono' }, fmtTime(training.setSeconds));
  const fatigueValue = el('div', { class: 'metric-value mono' }, training.fatiga + '%');
  const fatigueBadge = el('span', { class: 'fatigue-badge fatigue-low' }, 'Baja');

  box.appendChild(el('div', { class: 'metrics-row' }, [
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Reps de serie'), repValue]),
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Tiempo de serie'), timeValue]),
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Fatiga de serie'), fatigueValue]),
  ]));

  const canvas = el('canvas', { class: 'signal-canvas', 'aria-label': 'Señal EMG simulada del bíceps' });
  box.appendChild(el('div', { class: 'card signal-card' }, [
    el('div', { class: 'signal-heading' }, [
      el('strong', {}, 'Señal muscular'),
      el('span', {}, 'Bíceps · simulada'),
      fatigueBadge,
    ]),
    canvas,
  ]));

  const barFill = el('div', { class: 'bar-fill', style: 'width:0%' });
  const activationPct = el('span', { class: 'mono' }, '0%');
  box.appendChild(el('div', { class: 'card activation-card' }, [
    el('div', { class: 'activation-heading' }, [
      el('span', {}, 'Activación instantánea'),
      activationPct,
    ]),
    el('div', { class: 'bar-track' }, [barFill]),
    el('div', { class: 'completed-set-list' }, [
      el('div', { class: 'completed-set-heading' }, [
        el('span', {}, 'Series completadas'),
        el('span', {}, `${training.sets.length}/${plannedSets}`),
      ]),
      ...(training.sets.length
        ? training.sets.map((set, index) => el('div', { class: 'completed-set-row' }, [
            el('span', {}, `Serie ${index + 1}`),
            el('span', { class: 'mono' }, `${set.reps} reps · ${set.duracion}`),
          ]))
        : [el('div', { class: 'completed-set-row' }, [el('span', {}, 'Todavía no registraste series')])]),
    ]),
  ]));

  // ---------- Botones según la fase ----------
  if (training.phase === 'running' || training.phase === 'paused') {
    const isRunning = training.phase === 'running';
    const completeSetBtn = el('button', { class: 'btn-primary set-complete-btn', onclick: trainingCompleteSet }, `Terminar serie ${nextSetNumber}`);
    box.appendChild(completeSetBtn);
    box.appendChild(el('div', { class: 'controls-row' }, [
      el('button', { class: 'btn-secondary', onclick: isRunning ? trainingPause : trainingResume }, isRunning ? 'Pausar' : 'Reanudar'),
      el('button', { class: 'btn-primary', onclick: trainingAskFinish }, 'Terminar entrenamiento'),
    ]));
  } else if (training.phase === 'resting') {
    box.appendChild(el('div', { class: 'controls-row' }, [
      el('button', { class: 'btn-secondary', onclick: trainingStartNextSet }, `Empezar serie ${training.sets.length + 1}`),
      el('button', { class: 'btn-primary', onclick: trainingAskFinish }, 'Terminar entrenamiento'),
    ]));
  } else {
    const saving = training.phase === 'saving';
    const empty = training.reps === 0;
    const keepBtn = el('button', { class: 'btn-secondary', onclick: trainingKeepGoing }, 'Seguir');
    const saveBtn = el('button', { class: 'btn-primary', onclick: trainingSave },
      saving ? 'Guardando...' : (training.saveError ? 'Reintentar' : (empty ? 'Guardar igual' : 'Guardar y terminar')));
    const discardBtn = el('button', { class: 'btn-ghost', onclick: trainingDiscard }, 'Descartar sesión');
    if (saving || training.saveIndex > 0) { keepBtn.disabled = saving; saveBtn.disabled = saving; }
    if (saving || training.saveIndex > 0) {
      discardBtn.disabled = true;
      if (training.saveIndex > 0) discardBtn.title = 'Hay series guardadas; reintentá guardar las pendientes.';
    }

    box.appendChild(el('div', { class: 'card confirm-card' }, [
      el('div', { style: 'font-size:15px; font-weight:600; margin-bottom:6px' }, '¿Terminar y guardar esta sesión?'),
      el('p', { class: 'page-sub', style: 'margin:0 0 14px' },
        training.sets.length
          ? `${training.sets.length} ${training.sets.length === 1 ? 'serie registrada' : 'series registradas'} con ${training.sets.reduce((total, set) => total + set.reps, 0)} repeticiones.`
          : empty ? 'Todavía no se registró ninguna repetición.' : `${training.reps} repeticiones en ${fmtTime(training.setSeconds)}.`),
      training.sets.length ? el('div', { class: 'completed-set-list' }, training.sets.map((set, index) =>
        el('div', { class: 'completed-set-row' }, [
          el('span', {}, `Serie ${index + 1}`),
          el('span', { class: 'mono' }, `${set.reps} reps · ${set.duracion} · fatiga ${set.fatiga}%`),
        ])
      )) : null,
      training.saveError ? el('div', { class: 'error-text', style: 'margin:0 0 12px' }, training.saveError) : null,
      el('div', { class: 'controls-row' }, [keepBtn, saveBtn]),
      el('div', { style: 'text-align:center; margin-top:8px' }, [discardBtn]),
    ]));
  }

  box.appendChild(el('div', { class: 'note training-note', style: 'margin-top:14px' },
    'Esta señal es simulada. Cuando el circuito y el ESP32 estén listos, este bloque se conecta directo a la lectura real — el resto no cambia.'));

  // ---------- Dibujo y actualización en vivo ----------
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  function resizeCanvas() {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawWave() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.strokeStyle = 'rgba(120, 140, 120, 0.16)';
    ctx.lineWidth = 1;
    for (let row = 1; row < 4; row++) {
      const y = (h / 4) * row;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    for (let column = 1; column < 8; column++) {
      const x = (w / 8) * column;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    const pts = training.points;
    if (!pts.length) { ctx.restore(); return; }
    const step = w / 119;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = w - (pts.length - 1 - i) * step;
      const y = h - (p * (h - 16)) - 8;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.lineTo(w, h);
    ctx.lineTo(w - (pts.length - 1) * step, h);
    ctx.closePath();
    const signalRgb = getComputedStyle(document.documentElement).getPropertyValue('--signal-rgb').trim();
    const fill = ctx.createLinearGradient(0, 0, 0, h);
    fill.addColorStop(0, `rgba(${signalRgb}, 0.22)`);
    fill.addColorStop(1, `rgba(${signalRgb}, 0)`);
    ctx.fillStyle = fill;
    ctx.fill();

    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = w - (pts.length - 1 - i) * step;
      const y = h - (p * (h - 16)) - 8;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--signal').trim();
    ctx.lineWidth = 2.5;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.restore();
  }

  training.ui = {
    refresh() {
      repValue.textContent = String(training.reps);
      timeValue.textContent = fmtTime(training.setSeconds);
      fatigueValue.textContent = training.fatiga + '%';
      restTimerValue.textContent = fmtTime(training.restSeconds);
      const f = training.fatiga;
      fatigueBadge.className = 'fatigue-badge ' + (f < 35 ? 'fatigue-low' : f < 70 ? 'fatigue-mid' : 'fatigue-high');
      fatigueBadge.textContent = f < 35 ? 'Baja' : f < 70 ? 'Moderada' : 'Alta';
      const b = training.points.length ? training.points[training.points.length - 1] : 0;
      activationPct.textContent = Math.round(b * 100) + '%';
      barFill.style.width = (b * 100) + '%';
      drawWave();
    },
  };
  requestAnimationFrame(() => { resizeCanvas(); if (training.ui) training.ui.refresh(); });

  return box;
}

boot();

</script>
</body>
</html>
