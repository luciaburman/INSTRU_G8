<style>

    padding-top: env(safe-area-inset-top, 0px);

  @media (prefers-color-scheme: dark) {

      --surface: #14201B;
      --surface-2: #1B2A23;
      --border: #263831;
      --text: #EAF3EE;
      --text-secondary: #9BB0A6;

      --amber: #F5A524;
      --amber-bg: #2E2413;

      --red-bg: #2E1717;

    --surface-2: #1B2A23;

    --text: #EAF3EE;

<script>
/* =========================================================
   CONEXIÓN REAL A SUPABASE
   ========================================================= */
const SUPABASE_URL = 'https://lhzcprnlfbvjjswyjafp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoemNwcm5sZmJ2ampzd3lqYWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNjg2ODksImV4cCI6MjEwNTk0NDY4OX0.Yud1fajPzlWdYxxrVV-oEL_sLUxjlnIP1T5PdT72l0A';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DB = {
  async signUp(email, password) {
    return await supa.auth.signUp({ email, password });
  },
  async signIn(email, password) {
    return await supa.auth.signInWithPassword({ email, password });
  },
  async signOut() {
    await supa.auth.signOut();
  },
  async getCurrentUser() {
    const { data } = await supa.auth.getUser();
    return data.user || null;
  },
  async getProfile(userId) {
    const { data } = await supa.from('profiles').select('*').eq('id', userId).maybeSingle();
    return data;
  },
  async saveProfile(userId, profile) {
    await supa.from('profiles').upsert({ id: userId, ...profile });
  },
  async getSessions(userId) {
    const { data } = await supa.from('sessions').select('*').eq('user_id', userId).order('fecha', { ascending: false });
    return data || [];
  },
  async addSession(userId, session) {
    const { error } = await supa.from('sessions').insert({ user_id: userId, ...session });
    return { error };
  },
  // Lista para cuando el ESP32 empiece a escribir en emg_readings de verdad.
  subscribeToEMG(userId, onSample) {
    return supa
      .channel('emg-live-' + userId)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'emg_readings', filter: `user_id=eq.${userId}` },
        (payload) => onSample(payload.new.biceps, payload.new.fatiga)
      )
      .subscribe();
  },
};

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const state = {
  screen: 'landing',   // landing | auth | profile | dashboard
  authMode: 'login',   // login | signup
  authError: '',
  user: null,
  tab: 'entrenar',      // entrenar | plan | historial
};

async function boot() {
  // Supabase redirige acá después de confirmar el mail, agregando datos
  // en el hash de la URL (#access_token=...&type=signup). Los detectamos
  // antes de que el cliente los "limpie" automáticamente.
  const hash = window.location.hash;
  if (hash.includes('type=signup') || hash.includes('type=email_change') || hash.includes('type=recovery')) {
    state.justVerified = true;
  }
  // limpiamos la URL para que no quede el token visible ni se re-muestre el cartel al refrescar
  if (state.justVerified) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  // getSession() espera a que el cliente termine de procesar la URL, a diferencia de getUser()
  const { data: { session } } = await supa.auth.getSession();
  if (session?.user) {
    const profile = await DB.getProfile(session.user.id);
    state.user = { id: session.user.id, email: session.user.email, profile: profile || null };
    state.screen = profile ? 'dashboard' : 'profile';
    if (profile) state.sessions = await DB.getSessions(session.user.id);
  }
  render();

  if (state.justVerified) {
    showVerifiedBanner();
    state.justVerified = false;
  }
}

function showBanner(text, isError) {
  const banner = el('div', { class: 'verified-banner' + (isError ? ' error' : '') }, [
    el('span', { html: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>` }),
    el('span', {}, text),
  ]);
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 3500);
}
function showVerifiedBanner() { showBanner('Cuenta verificada'); }

/* =========================================================
   GENERADOR DE PLAN — reglas, sin IA externa
   ========================================================= */
function generarPlan(profile) {
  const { nivel, objetivo } = profile;
  const tablas = {
    hipertrofia: {
      principiante: { series: 3, repeticiones: '10-12', descanso: '60s', frecuencia: '2x por semana' },
      intermedio:   { series: 4, repeticiones: '8-10',  descanso: '75s', frecuencia: '3x por semana' },
      avanzado:     { series: 5, repeticiones: '6-8',   descanso: '90s', frecuencia: '3-4x por semana' },
    },
    resistencia: {
      principiante: { series: 3, repeticiones: '15-18', descanso: '30s', frecuencia: '2x por semana' },
      intermedio:   { series: 3, repeticiones: '18-22', descanso: '30s', frecuencia: '3x por semana' },
      avanzado:     { series: 4, repeticiones: '20-25', descanso: '25s', frecuencia: '3-4x por semana' },
    },
    fuerza: {
      principiante: { series: 3, repeticiones: '5-6',  descanso: '120s', frecuencia: '2x por semana' },
      intermedio:   { series: 4, repeticiones: '4-6',  descanso: '150s', frecuencia: '2-3x por semana' },
      avanzado:     { series: 5, repeticiones: '3-5',  descanso: '180s', frecuencia: '3x por semana' },
    },
  };
  return (tablas[objetivo] && tablas[objetivo][nivel]) || tablas.hipertrofia.principiante;
}

/* =========================================================
   FUENTE DE SEÑAL EMG
   -----------------------------------------------------------
   Hoy genera una señal simulada. Cuando el ESP32 esté mandando datos
   reales a Supabase, solo hay que reemplazar el contenido de start():
     const ch = DB.subscribeToEMG(state.user.id, (biceps) => onSample(biceps));
     return () => supa.removeChannel(ch);
   El resto de la app no cambia.
   ========================================================= */
const emgSource = {
  simT: -0.625, // arranca con el músculo relajado
  start(onSample) {
    const id = setInterval(() => {
      emgSource.simT += 0.05;
      const cycle = (Math.sin(emgSource.simT * 2 * Math.PI / 2.5) + 1) / 2;
      const b = cycle * (0.92 + Math.random() * 0.08);
      onSample(Math.min(1, Math.max(0, b)));
    }, 50);
    return () => clearInterval(id);
  },
};

/* =========================================================
   SESIÓN DE ENTRENAMIENTO
   phase: idle -> running <-> paused -> confirming -> saving -> (historial)
   Vive fuera de la pantalla, así que si cambiás de pestaña
   mientras entrenás no se pierde nada.
   ========================================================= */
const training = {
  phase: 'idle',
  reps: 0, seconds: 0, fatiga: 0,
  repState: 'relajado',
  points: [],
  startedAt: null,
  saveError: '',
  clock: null, stopSource: null,
  ui: null, // lo completa renderEntrenar mientras la pestaña está visible
};

const REP_UP = 0.5, REP_DOWN = 0.35;

function fmtTime(s) {
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${m}:${ss}`;
}

function trainingStopLoops() {
  clearInterval(training.clock);
  training.clock = null;
  if (training.stopSource) { training.stopSource(); training.stopSource = null; }
}

function trainingStartLoops() {
  trainingStopLoops();
  training.clock = setInterval(() => {
    training.seconds++;
    if (training.ui) training.ui.refresh();
  }, 1000);
  training.stopSource = emgSource.start(onEmgSample);
}

function trainingReset() {
  trainingStopLoops();
  training.phase = 'idle';
  training.reps = 0; training.seconds = 0; training.fatiga = 0;
  training.repState = 'relajado';
  training.points = [];
  training.startedAt = null;
  training.saveError = '';
  emgSource.simT = -0.625;
}

function onEmgSample(b) {
  training.points.push(b);
  if (training.points.length > 120) training.points.shift();

  if (training.repState === 'relajado' && b > REP_UP) {
    training.repState = 'contraido';
  } else if (training.repState === 'contraido' && b < REP_DOWN) {
    training.repState = 'relajado';
    training.reps++;
    training.fatiga = Math.min(100, training.reps * 4); // placeholder hasta tener el modelo de ML
  }
  if (training.ui) training.ui.refresh();
}

function trainingStart() {
  trainingReset();
  training.phase = 'running';
  training.startedAt = new Date().toISOString();
  trainingStartLoops();
  render();
}
function trainingPause() { training.phase = 'paused'; trainingStopLoops(); render(); }
function trainingResume() { training.phase = 'running'; trainingStartLoops(); render(); }
function trainingAskFinish() { trainingStopLoops(); training.phase = 'confirming'; training.saveError = ''; render(); }
function trainingKeepGoing() { training.phase = 'running'; trainingStartLoops(); render(); }
function trainingDiscard() { trainingReset(); render(); }

async function trainingSave() {
  training.phase = 'saving';
  training.saveError = '';
  render();
  const { error } = await DB.addSession(state.user.id, {
    fecha: training.startedAt,
    reps: training.reps,
    duracion: fmtTime(training.seconds),
    fatiga: training.fatiga,
  });
  if (error) {
    // no perdemos la sesión: queda en pantalla para reintentar
    training.phase = 'confirming';
    training.saveError = 'No se pudo guardar: ' + error.message;
    render();
    return;
  }
  state.sessions = await DB.getSessions(state.user.id);
  trainingReset();
  state.tab = 'historial';
  render();
  showBanner('Sesión guardada');
}

window.addEventListener('beforeunload', (e) => {
  if (training.phase !== 'idle') { e.preventDefault(); e.returnValue = ''; }
});

/* =========================================================
   HELPERS DE ONDA (hero + dashboard)
   ========================================================= */
function drawHeroWave(canvas) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const resize = () => {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);
  };
  resize();
  let t = 0;
  const cssColor = getComputedStyle(document.documentElement).getPropertyValue('--signal').trim();
  function frame() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const freq = 0.06;
      const envelope = (Math.sin((x * 0.01) + t * 0.6) + 1) / 2;
      const y = h/2 + Math.sin(x * freq + t) * (6 + envelope * 26) * Math.sin(x*0.15+t*2)*0.3 + Math.sin(x*freq*3+t*1.7)*(4+envelope*10);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = cssColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    t += 0.04;
    canvas._raf = requestAnimationFrame(frame);
  }
  frame();
  return () => cancelAnimationFrame(canvas._raf);
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.screen === 'landing') app.appendChild(renderLanding());
  else if (state.screen === 'auth') app.appendChild(renderAuth());
  else if (state.screen === 'profile') app.appendChild(renderProfile());
  else if (state.screen === 'dashboard') app.appendChild(renderDashboard());
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

/* ---------- Landing ---------- */
function renderLanding() {
  const wrap = el('div', { class: 'screen landing' });

  const top = el('div', {}, [
    el('div', { class: 'brand' }, [
      el('div', { class: 'brand-mark' }, [
        el('span', { html: `<svg viewBox="0 0 24 24" fill="none" stroke="var(--signal)" stroke-width="2"><path d="M2 12h4l2-7 4 14 2-7h8"/></svg>` })
      ]),
      el('span', { class: 'brand-name' }, 'Curl EMG'),
    ]),
  ]);

  const canvas = el('canvas', { class: 'hero-wave' });
  const mid = el('div', {}, [
    canvas,
    el('h1', { class: 'hero-title' }, 'Medí tu bíceps mientras entrenás.'),
    el('p', { class: 'hero-sub' }, 'Electromiografía en tiempo real, conteo automático de repeticiones y un modelo que te avisa cuándo tu músculo empieza a fatigarse.'),
  ]);

  const bottom = el('div', { class: 'cta-row' }, [
    el('button', { class: 'btn-primary', onclick: () => { state.screen = 'auth'; state.authMode = 'signup'; render(); } }, 'Crear cuenta'),
    el('button', { class: 'btn-secondary', onclick: () => { state.screen = 'auth'; state.authMode = 'login'; render(); } }, 'Ya tengo cuenta'),
  ]);

  wrap.appendChild(top);
  wrap.appendChild(mid);
  wrap.appendChild(bottom);
  requestAnimationFrame(() => drawHeroWave(canvas));
  return wrap;
}

/* ---------- Auth ---------- */
function renderAuth() {
  const wrap = el('div', { class: 'screen' });
  const isSignup = state.authMode === 'signup';

  wrap.appendChild(el('div', { class: 'back-row' }, [
    el('button', { class: 'back-btn', 'aria-label': 'Volver', onclick: () => { state.screen = 'landing'; render(); }, html: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>` }),
  ]));

  wrap.appendChild(el('h2', { class: 'page-title' }, isSignup ? 'Creá tu cuenta' : 'Iniciá sesión'));
  wrap.appendChild(el('p', { class: 'page-sub' }, isSignup ? 'Vas a poder calibrar tu perfil y guardar tu historial de entrenamiento.' : 'Ingresá con tu email y contraseña.'));

  const emailInput = el('input', { type: 'email', autocomplete: 'email', placeholder: 'vos@ejemplo.com' });
  const passInput = el('input', { type: 'password', autocomplete: isSignup ? 'new-password' : 'current-password', placeholder: '••••••••' });

  const form = el('form', {}, [
    el('div', { class: 'field' }, [el('label', {}, 'Email'), emailInput]),
    el('div', { class: 'field' }, [el('label', {}, 'Contraseña'), passInput]),
  ]);

  const errorBox = el('div', { class: 'error-text', role: 'alert', 'aria-live': 'polite' }, state.authError || '');
  if (!state.authError) errorBox.style.display = 'none';

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = emailInput.value.trim().toLowerCase();
    const pass = passInput.value;
    if (!email || !pass) { state.authError = 'Completá los dos campos.'; render(); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Un momento...';

    if (isSignup) {
      const { data, error } = await DB.signUp(email, pass);
      if (error) {
        const accountExists = error.code === 'user_already_exists' || /already (registered|exists)/i.test(error.message || '');
        state.authError = accountExists
          ? 'Ya existe una cuenta con ese email. Iniciá sesión con tu cuenta.'
          : error.message;
        render();
        return;
      }
      if (data.user?.identities?.length === 0) {
        state.authError = 'Ya existe una cuenta con ese email. Iniciá sesión con tu cuenta.';
        render();
        return;
      }
      if (!data.session) {
        // El proyecto tiene "Confirm email" activado: hay que confirmar por mail antes de poder entrar.
        state.authError = '';
        state.authMode = 'login';
        state.screen = 'auth';
        alert('Cuenta creada. Revisá tu email para confirmarla antes de iniciar sesión.');
        render();
        return;
      }
      state.user = { id: data.user.id, email: data.user.email, profile: null };
      state.screen = 'profile';
      render();
    } else {
      const { data, error } = await DB.signIn(email, pass);
      if (error) { state.authError = error.message; render(); return; }
      const profile = await DB.getProfile(data.user.id);
      state.user = { id: data.user.id, email: data.user.email, profile };
      if (profile) state.sessions = await DB.getSessions(data.user.id);
      state.screen = profile ? 'dashboard' : 'profile';
      render();
    }
  });

  const submitBtn = el('button', { class: 'btn-primary', type: 'submit', style: 'margin-top:6px' }, isSignup ? 'Crear cuenta' : 'Ingresar');
  form.appendChild(submitBtn);

  wrap.appendChild(form);
  wrap.appendChild(errorBox);
  wrap.appendChild(el('button', {
    class: 'btn-ghost', style: 'margin-top:16px',
    onclick: () => { state.authMode = isSignup ? 'login' : 'signup'; state.authError=''; render(); }
  }, isSignup ? '¿Ya tenés cuenta? Iniciá sesión' : '¿No tenés cuenta? Creá una'));

  return wrap;
}

/* ---------- Profile setup ---------- */
function renderProfile() {
  const wrap = el('div', { class: 'screen' });
  wrap.appendChild(el('h2', { class: 'page-title' }, 'Contanos sobre vos'));
  wrap.appendChild(el('p', { class: 'page-sub' }, 'Con esto armamos tu plan de entrenamiento y calibramos las métricas.'));

  const peso = el('input', { type: 'number', placeholder: '70', min: '30', max: '250' });
  const altura = el('input', { type: 'number', placeholder: '175', min: '120', max: '230' });
  const nivel = el('select', {}, [
    el('option', { value: 'principiante' }, 'Principiante'),
    el('option', { value: 'intermedio' }, 'Intermedio'),
    el('option', { value: 'avanzado' }, 'Avanzado'),
  ]);
  const objetivo = el('select', {}, [
    el('option', { value: 'hipertrofia' }, 'Hipertrofia (ganar masa muscular)'),
    el('option', { value: 'resistencia' }, 'Resistencia'),
    el('option', { value: 'fuerza' }, 'Fuerza máxima'),
  ]);

  const form = el('form', {}, [
    el('div', { class: 'field' }, [el('label', {}, 'Peso (kg)'), peso]),
    el('div', { class: 'field' }, [el('label', {}, 'Altura (cm)'), altura]),
    el('div', { class: 'field' }, [el('label', {}, 'Nivel de entrenamiento'), nivel]),
    el('div', { class: 'field' }, [el('label', {}, 'Objetivo principal'), objetivo]),
  ]);

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const profile = {
      peso: Number(peso.value) || 70,
      altura: Number(altura.value) || 170,
      nivel: nivel.value,
      objetivo: objetivo.value,
    };
    await DB.saveProfile(state.user.id, profile);
    state.user.profile = profile;
    state.sessions = await DB.getSessions(state.user.id);
    state.screen = 'dashboard';
    state.tab = 'plan';
    render();
  });

  form.appendChild(el('button', { class: 'btn-primary', type: 'submit', style: 'margin-top:6px' }, 'Armar mi plan'));
  wrap.appendChild(form);
  return wrap;
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  training.ui = null;
  const wrap = el('div', { class: 'screen wide' });

  wrap.appendChild(el('div', { class: 'topbar' }, [
    el('div', { class: 'user-chip' }, [
      el('span', { class: 'status-dot' }),
      el('span', {}, state.user.email),
    ]),
    el('button', { class: 'logout-link', onclick: async () => { trainingReset(); await DB.signOut(); state.user = null; state.sessions = []; state.screen = 'landing'; render(); } }, 'Cerrar sesión'),
  ]));

  const tabs = el('div', { class: 'tabs' }, [
    tabButton('entrenar', 'Entrenar'),
    tabButton('plan', 'Plan'),
    tabButton('historial', 'Historial'),
  ]);
  wrap.appendChild(tabs);

  const content = el('div', {});
  if (state.tab === 'entrenar') content.appendChild(renderEntrenar());
  if (state.tab === 'plan') content.appendChild(renderPlanTab());
  if (state.tab === 'historial') content.appendChild(renderHistorialTab());
  wrap.appendChild(content);

  return wrap;
}

function tabButton(key, label) {
  const live = key === 'entrenar' && training.phase !== 'idle';
  return el('button', {
    class: 'tab-btn' + (state.tab === key ? ' active' : ''),
    onclick: () => { state.tab = key; render(); },
  }, live ? [label, el('span', { class: 'live-dot' })] : label);
}

function renderPlanTab() {
  const plan = generarPlan(state.user.profile);
  const card = el('div', { class: 'card' }, [
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Series'), el('span', { class: 'plan-item-value' }, String(plan.series))]),
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Repeticiones'), el('span', { class: 'plan-item-value' }, plan.repeticiones)]),
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Descanso'), el('span', { class: 'plan-item-value' }, plan.descanso)]),
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Frecuencia'), el('span', { class: 'plan-item-value' }, plan.frecuencia)]),
  ]);
  const box = el('div', {}, [
    el('p', { class: 'page-sub', style: 'margin-top:0' }, `Armado para objetivo "${state.user.profile.objetivo}", nivel "${state.user.profile.nivel}".`),
    card,
    el('div', { class: 'note' }, 'Este plan se genera con reglas simples a partir de tu perfil — no usa un modelo de IA externo, así que no depende de conexión a ningún servicio de terceros.'),
  ]);
  return box;
}

function renderHistorialTab() {
  const sessions = state.sessions || [];
  if (!sessions.length) {
    return el('div', { class: 'card' }, [el('div', { class: 'empty-state' }, 'Todavía no completaste ninguna sesión. Andá a la pestaña "Entrenar" para arrancar.')]);
  }
  const rows = sessions.map(s => el('div', { class: 'session-row' }, [
    el('span', { class: 'session-date' }, new Date(s.fecha).toLocaleString('es-AR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })),
    el('span', { class: 'session-stats mono' }, `${s.reps} reps · ${s.duracion} · fatiga ${s.fatiga}%`),
  ]));
  return el('div', { class: 'card' }, rows);
}

function renderEntrenar() {
  const box = el('div', {});
  training.ui = null;

  // ---------- Antes de empezar ----------
  if (training.phase === 'idle') {
    const plan = generarPlan(state.user.profile);
    box.appendChild(el('div', { class: 'card' }, [
      el('h2', { class: 'page-title', style: 'font-size:18px' }, 'Listo para entrenar'),
      el('p', { class: 'page-sub', style: 'margin-bottom:18px' },
        `Tu plan: ${plan.series} series de ${plan.repeticiones} repeticiones, con ${plan.descanso} de descanso.`),
      el('button', { class: 'btn-primary', onclick: trainingStart }, 'Iniciar entrenamiento'),
    ]));
    box.appendChild(el('div', { class: 'note' },
      'Al terminar, la sesión se guarda en tu historial. La señal EMG es simulada hasta que el circuito esté conectado.'));
    return box;
  }

  // ---------- Sesión en curso / pausa / confirmación ----------
  const phaseLabels = { running: 'En curso', paused: 'En pausa', confirming: 'En pausa', saving: 'Guardando...' };
  box.appendChild(el('div', { class: 'phase-pill phase-' + training.phase }, phaseLabels[training.phase]));

  const repValue = el('div', { class: 'metric-value mono' }, String(training.reps));
  const timeValue = el('div', { class: 'metric-value mono' }, fmtTime(training.seconds));
  const fatigueValue = el('div', { class: 'metric-value mono' }, training.fatiga + '%');
  const fatigueBadge = el('span', { class: 'fatigue-badge fatigue-low' }, 'Baja');

  box.appendChild(el('div', { class: 'metrics-row' }, [
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Repeticiones'), repValue]),
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Tiempo'), timeValue]),
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Fatiga'), fatigueValue]),
  ]));

  const canvas = el('canvas', { style: 'width:100%; height:140px; display:block;' });
  box.appendChild(el('div', { class: 'card' }, [
    el('div', { style: 'display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;' }, [
      el('span', { style: 'font-size:12px; color:var(--text-muted);' }, 'Envolvente EMG — bíceps (simulado)'),
      fatigueBadge,
    ]),
    canvas,
  ]));

  const barFill = el('div', { class: 'bar-fill', style: 'width:0%' });
  const activationPct = el('span', { class: 'mono' }, '0%');
  box.appendChild(el('div', { class: 'card' }, [
    el('div', { style: 'display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; color:var(--text-secondary);' }, [
      el('span', {}, 'Activación instantánea'),
      activationPct,
    ]),
    el('div', { class: 'bar-track' }, [barFill]),
  ]));

  // ---------- Botones según la fase ----------
  if (training.phase === 'running' || training.phase === 'paused') {
    const isRunning = training.phase === 'running';
    box.appendChild(el('div', { class: 'controls-row' }, [
      el('button', { class: 'btn-secondary', onclick: isRunning ? trainingPause : trainingResume }, isRunning ? 'Pausar' : 'Reanudar'),
      el('button', { class: 'btn-primary', onclick: trainingAskFinish }, 'Terminar'),
    ]));
  } else {
    const saving = training.phase === 'saving';
    const empty = training.reps === 0;
    const keepBtn = el('button', { class: 'btn-secondary', onclick: trainingKeepGoing }, 'Seguir');
    const saveBtn = el('button', { class: 'btn-primary', onclick: trainingSave },
      saving ? 'Guardando...' : (training.saveError ? 'Reintentar' : (empty ? 'Guardar igual' : 'Guardar y terminar')));
    const discardBtn = el('button', { class: 'btn-ghost', onclick: trainingDiscard }, 'Descartar sesión');
    if (saving) { keepBtn.disabled = true; saveBtn.disabled = true; discardBtn.disabled = true; }

    box.appendChild(el('div', { class: 'card' }, [
      el('div', { style: 'font-size:15px; font-weight:600; margin-bottom:6px' }, '¿Terminar y guardar esta sesión?'),
      el('p', { class: 'page-sub', style: 'margin:0 0 14px' },
        empty ? 'Todavía no se registró ninguna repetición.'
              : `${training.reps} repeticiones en ${fmtTime(training.seconds)}.`),
      training.saveError ? el('div', { class: 'error-text', style: 'margin:0 0 12px' }, training.saveError) : null,
      el('div', { class: 'controls-row' }, [keepBtn, saveBtn]),
      el('div', { style: 'text-align:center; margin-top:8px' }, [discardBtn]),
    ]));
  }

  box.appendChild(el('div', { class: 'note', style: 'margin-top:14px' },
    'Esta señal es simulada. Cuando el circuito y el ESP32 estén listos, este bloque se conecta directo a la lectura real — el resto no cambia.'));

  // ---------- Dibujo y actualización en vivo ----------
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  function resizeCanvas() {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawWave() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const pts = training.points;
    if (!pts.length) return;
    const step = w / 119;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = w - (pts.length - 1 - i) * step;
      const y = h - (p * (h - 16)) - 8;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--signal').trim();
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  training.ui = {
    refresh() {
      repValue.textContent = String(training.reps);
      timeValue.textContent = fmtTime(training.seconds);
      fatigueValue.textContent = training.fatiga + '%';
      const f = training.fatiga;
      fatigueBadge.className = 'fatigue-badge ' + (f < 35 ? 'fatigue-low' : f < 70 ? 'fatigue-mid' : 'fatigue-high');
      fatigueBadge.textContent = f < 35 ? 'Baja' : f < 70 ? 'Moderada' : 'Alta';
      const b = training.points.length ? training.points[training.points.length - 1] : 0;
      activationPct.textContent = Math.round(b * 100) + '%';
      barFill.style.width = (b * 100) + '%';
      drawWave();
    },
  };
  requestAnimationFrame(() => { resizeCanvas(); if (training.ui) training.ui.refresh(); });

  return box;
}

boot();

</script>
</body>
</html>
