  wrap.appendChild(el('h2', { class: 'page-title' }, isEditing ? 'Editar mi perfil' : 'Contanos sobre vos'));
  wrap.appendChild(el('p', { class: 'page-sub' }, isEditing
    ? 'Actualizá tus datos personales y preferencias de entrenamiento.'
    : 'Con esto armamos tu plan de entrenamiento y calibramos las métricas.'));

  const feedback = el('div', { class: 'profile-feedback', role: 'status', 'aria-live': 'polite' });
  if (isEditing) {
    const initial = (state.user.email || 'U').charAt(0).toUpperCase();
    const avatarInitial = el('span', { class: 'profile-avatar-initial' }, initial);
    const avatarImage = el('img', { class: 'profile-avatar-image', alt: 'Foto de perfil' });
    const photo = getProfilePhoto(state.user.id);
    if (photo) { avatarImage.src = photo; avatarInitial.style.display = 'none'; }
    else avatarImage.style.display = 'none';

    const photoInput = el('input', { type: 'file', accept: 'image/*', 'aria-label': 'Elegir foto de perfil' });
    const photoPicker = el('label', { class: 'btn-secondary photo-picker' }, ['Cambiar foto', photoInput]);
    photoInput.addEventListener('change', async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/') || file.size > 8 * 1024 * 1024) {
        feedback.className = 'profile-feedback error';
        feedback.textContent = 'Elegí una imagen de hasta 8 MB.';
        feedback.style.display = 'block';
        return;
      }
      try {
        const compressedPhoto = await compressProfilePhoto(file);
        localStorage.setItem(profilePhotoKey(state.user.id), compressedPhoto);
        avatarImage.src = compressedPhoto;
        avatarImage.style.display = 'block';
        avatarInitial.style.display = 'none';
        feedback.className = 'profile-feedback success';
        feedback.textContent = 'Foto guardada en este dispositivo.';
        feedback.style.display = 'block';
      } catch (error) {
        feedback.className = 'profile-feedback error';
        feedback.textContent = error.message || 'No se pudo guardar la foto.';
        feedback.style.display = 'block';
      }
    });

    wrap.appendChild(el('div', { class: 'profile-photo-row' }, [
      el('div', { class: 'profile-avatar' }, [avatarInitial, avatarImage]),
      el('div', { class: 'profile-photo-details' }, [
        el('strong', {}, 'Foto de perfil'),
        el('p', {}, 'La foto se guarda en este dispositivo.'),
        photoPicker,
      ]),
    ]));
  }

  const peso = el('input', { type: 'number', placeholder: '70', min: '30', max: '250', required: 'required', value: current.peso ?? '' });
  const altura = el('input', { type: 'number', placeholder: '175', min: '120', max: '230', required: 'required', value: current.altura ?? '' });
  const nivel = el('select', {}, [
    el('option', { value: 'principiante' }, 'Principiante'),
    el('option', { value: 'intermedio' }, 'Intermedio'),
    el('option', { value: 'avanzado' }, 'Avanzado'),
  ]);
  const objetivo = el('select', {}, [
    el('option', { value: 'hipertrofia' }, 'Hipertrofia (ganar masa muscular)'),
    el('option', { value: 'resistencia' }, 'Resistencia'),
    el('option', { value: 'fuerza' }, 'Fuerza máxima'),
  ]);
  nivel.value = current.nivel || 'principiante';
  objetivo.value = current.objetivo || 'hipertrofia';

  const fields = el('div', { class: 'profile-fields' }, [
    el('div', { class: 'field' }, [el('label', {}, 'Peso (kg)'), peso]),
    el('div', { class: 'field' }, [el('label', {}, 'Altura (cm)'), altura]),
    el('div', { class: 'field' }, [el('label', {}, 'Nivel de entrenamiento'), nivel]),
    el('div', { class: 'field' }, [el('label', {}, 'Objetivo principal'), objetivo]),
  ]);
  const form = el('form', { class: isEditing ? 'profile-form' : '' }, [fields]);
  const submitButton = el('button', { class: 'btn-primary', type: 'submit', style: 'margin-top:6px' }, isEditing ? 'Guardar cambios' : 'Armar mi plan');
  form.appendChild(submitButton);
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const profile = {
      peso: Number(peso.value) || 70,
      altura: Number(altura.value) || 170,
      nivel: nivel.value,
      objetivo: objetivo.value,
    };
    submitButton.disabled = true;
    submitButton.textContent = 'Guardando...';
    const { error } = await DB.saveProfile(state.user.id, profile);
    if (error) {
      feedback.className = 'profile-feedback error';
      feedback.textContent = 'No se pudo guardar el perfil: ' + error.message;
      feedback.style.display = 'block';
      submitButton.disabled = false;
      submitButton.textContent = isEditing ? 'Guardar cambios' : 'Armar mi plan';
      return;
    }
    state.user.profile = profile;
    if (!isEditing) {
      state.sessions = await DB.getSessions(state.user.id);
      state.screen = 'dashboard';
      state.tab = 'plan';
      render();
      return;
    }
    showBanner('Perfil actualizado');
    render();
  });

  wrap.appendChild(form);
  if (isEditing) wrap.appendChild(feedback);
  if (isEditing) wrap.appendChild(renderCambiarContrasena());
  return wrap;
}

// Cambiar la contraseña estando logueado: no necesita mandar ningún mail
function renderCambiarContrasena() {
  const nueva = camposContrasenaNueva('Contraseña nueva');
  const aviso = el('div', { class: 'profile-feedback', role: 'status', 'aria-live': 'polite' });
  const boton = el('button', { class: 'btn-secondary', type: 'submit', style: 'margin-top:6px' }, 'Cambiar contraseña');
  const form = el('form', { novalidate: 'novalidate' }, [el('div', { class: 'profile-fields' }, nueva.campos), boton]);
  const mostrar = (tipo, texto) => { aviso.className = 'profile-feedback ' + tipo; aviso.textContent = texto; aviso.style.display = 'block'; };
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const problema = nueva.validar();
    if (problema) { mostrar('error', problema); return; }
    boton.disabled = true; boton.textContent = 'Guardando...';
    const { error } = await DB.updatePassword(nueva.input.value);
    boton.disabled = false; boton.textContent = 'Cambiar contraseña';
    if (error) { mostrar('error', traducirError(error)); return; }
    form.reset();
    nueva.input.dispatchEvent(new Event('input'));
    mostrar('success', 'Contraseña actualizada.');
  });
  return el('div', { class: 'card password-card' }, [
    el('h3', { class: 'page-title' }, 'Contraseña'),
    el('p', { class: 'page-sub' }, 'Elegí una contraseña nueva para tu cuenta.'),
    form,
    aviso,
  ]);
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  training.ui = null;
  const wrap = el('div', { class: 'screen wide' });

  wrap.appendChild(el('div', { class: 'topbar' }, [
    el('div', { class: 'user-chip' }, [
      getProfilePhoto(state.user.id)
        ? el('img', { class: 'user-avatar', src: getProfilePhoto(state.user.id), alt: '' })
        : el('span', { class: 'status-dot' }),
      el('span', {}, state.user.email),
    ]),
    el('button', { class: 'logout-link', onclick: async () => { trainingReset(); sensor.disconnect(); await DB.signOut(); state.user = null; state.sessions = []; state.screen = 'landing'; render(); } }, 'Cerrar sesión'),
  ]));

  const tabs = el('div', { class: 'tabs' }, [
    tabButton('entrenar', 'Entrenar'),
    tabButton('plan', 'Plan'),
    tabButton('historial', 'Historial'),
    tabButton('perfil', 'Perfil'),
  ]);
  wrap.appendChild(tabs);

  const content = el('div', {});
  if (state.tab === 'entrenar') content.appendChild(renderEntrenar());
  if (state.tab === 'plan') content.appendChild(renderPlanTab());
  if (state.tab === 'historial') content.appendChild(renderHistorialTab());
  if (state.tab === 'perfil') content.appendChild(renderProfile(true));
  wrap.appendChild(content);

  return wrap;
}

function tabButton(key, label) {
  const live = key === 'entrenar' && training.phase !== 'idle';
  return el('button', {
    class: 'tab-btn' + (state.tab === key ? ' active' : ''),
    onclick: () => { state.tab = key; render(); },
  }, live ? [label, el('span', { class: 'live-dot' })] : label);
}

function renderPlanTab() {
  const plan = generarPlan(state.user.profile);
  const card = el('div', { class: 'card' }, [
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Series'), el('span', { class: 'plan-item-value' }, String(plan.series))]),
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Repeticiones'), el('span', { class: 'plan-item-value' }, plan.repeticiones)]),
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Descanso'), el('span', { class: 'plan-item-value' }, plan.descanso)]),
    el('div', { class: 'plan-item' }, [el('span', { class: 'plan-item-label' }, 'Frecuencia'), el('span', { class: 'plan-item-value' }, plan.frecuencia)]),
  ]);
  const box = el('div', {}, [
    el('p', { class: 'page-sub', style: 'margin-top:0' }, `Armado para objetivo "${state.user.profile.objetivo}", nivel "${state.user.profile.nivel}".`),
    card,
  ]);
  return box;
}

function renderHistorialTab() {
  const sessions = state.sessions || [];
  if (!sessions.length) {
    return el('div', { class: 'card' }, [el('div', { class: 'empty-state' }, 'Todavía no completaste ninguna sesión. Andá a la pestaña "Entrenar" para arrancar.')]);
  }
  const groups = new Map();
  sessions.forEach((session) => {
    if (!groups.has(session.fecha)) groups.set(session.fecha, []);
    groups.get(session.fecha).push(session);
  });
  const rows = Array.from(groups.entries()).map(([fecha, sets]) => {
    const totalReps = sets.reduce((total, set) => total + (Number(set.reps) || 0), 0);
    const dateLabel = new Date(fecha).toLocaleString('es-AR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    const pesoKg = sets[0].peso_kg;
    const pesoLabel = pesoKg == null || !Number.isFinite(Number(pesoKg)) ? '' : ` · ${Number(pesoKg)} kg`;
    if (sets.length === 1) {
      const set = sets[0];
      return el('div', { class: 'session-group' }, [
        el('div', { class: 'session-group-heading' }, [
          el('span', { class: 'session-date' }, dateLabel),
          el('span', { class: 'session-stats mono' }, `${totalReps} reps · ${set.duracion} · ${fatigaLabel(set.fatiga)}${pesoLabel}`),
        ]),
      ]);
    }
    return el('div', { class: 'session-group' }, [
      el('div', { class: 'session-group-heading' }, [
        el('span', { class: 'session-date' }, dateLabel),
        el('span', { class: 'session-stats mono' }, `${sets.length} ${sets.length === 1 ? 'serie' : 'series'} · ${totalReps} reps${pesoLabel}`),
      ]),
      ...sets.map((set, index) => el('div', { class: 'session-set-row' }, [
        el('span', {}, `Serie ${index + 1}`),
        el('span', { class: 'mono' }, `${set.reps} reps · ${set.duracion} · ${fatigaLabel(set.fatiga)}`),
      ])),
    ]);
  });
  return el('div', { class: 'card' }, rows);
}

// Aviso al usuario cuando sube la fatiga: vibración (celular) y un pitido.
let audioCtx = null;
function pitido(veces) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < veces; i++) {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i * 0.3;
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + 0.2);
    }
  } catch {}
}
function avisarFatiga(estado) {
  const aviso = { leve: [1, [150]], moderada: [2, [200, 100, 200]], alta: [3, [400, 150, 400, 150, 400]] }[estado];
  if (!aviso) return;
  pitido(aviso[0]);
  if (navigator.vibrate) navigator.vibrate(aviso[1]);
}

function renderEntrenar() {
  const isResting = training.phase === 'resting';
  const box = el('div', { class: 'training-view' + (isResting ? ' training-view-resting' : '') });
  training.ui = null;

  const sensorBadge = el('span', { class: 'sensor-badge' }, '');
  const sensorText = el('span', { class: 'sensor-text' }, '');
  const connectBtn = el('button', { class: 'btn-secondary sensor-connect', onclick: () => sensor.connect() }, 'Conectar sensor');
  function refreshSensor() {
    const st = sensor.status;
    sensorBadge.className = 'sensor-badge sensor-' + st;
    sensorBadge.textContent = { nosoportado: 'Sin Bluetooth', off: 'Sensor desconectado', connecting: 'Conectando…', waiting: 'Esperando datos', live: 'Sensor en vivo', stale: 'Sin datos del sensor' }[st];
    sensorText.textContent = sensor.error || {
      nosoportado: 'Este navegador no tiene Bluetooth. Abrí la app en Chrome o Edge (compu o Android).',
      off: sensor.device ? 'Se cortó la conexión con el sensor.' : `Prendé el sensor y tocá "Conectar sensor". Elegí "${BLE_SENSOR.nombre}" en la lista.`,
      connecting: '',
      waiting: 'Conectado. Esperando el primer dato del sensor…',
      live: `Recibiendo datos de ${BLE_SENSOR.nombre}.`,
      stale: `El sensor no manda datos hace ${Math.round((Date.now() - sensor.lastAt) / 1000)} s. Revisá que esté encendido y cerca.`,
    }[st];
    connectBtn.hidden = !(st === 'off');
    connectBtn.textContent = sensor.device ? 'Reconectar' : 'Conectar sensor';
  }

  // ---------- Antes de empezar ----------
  if (training.phase === 'idle') {
    const plan = generarPlan(state.user.profile);
    const weightInput = el('input', {
      type: 'number', min: '0', step: '0.5', required: 'required',
      id: 'peso-trabajo', placeholder: 'Ej.: 10', inputmode: 'decimal',
    });
    box.appendChild(el('div', { class: 'card training-start-card' }, [
      el('h2', { class: 'page-title', style: 'font-size:18px' }, 'Listo para entrenar'),
      el('p', { class: 'page-sub', style: 'margin-bottom:18px' },
        `Tu plan: ${plan.series} series de ${plan.repeticiones} repeticiones, con ${plan.descanso} de descanso.`),
      el('div', { class: 'field' }, [
        el('label', { for: 'peso-trabajo' }, 'Peso de trabajo (kg)'),
        weightInput,
      ]),
      el('button', { class: 'btn-primary', onclick: () => trainingStart(weightInput) }, 'Iniciar entrenamiento'),
    ]));
    box.appendChild(el('div', { class: 'card sensor-card' }, [
      el('div', { class: 'sensor-head' }, [el('strong', {}, 'Sensor'), sensorBadge]),
      sensorText,
      connectBtn,
    ]));
    training.ui = { refresh: refreshSensor };
    refreshSensor();
    return box;
  }

  // ---------- Sesión en curso / pausa / confirmación ----------
  const phaseLabels = { running: 'En curso', paused: 'En pausa', resting: 'Descanso', confirming: 'En pausa', saving: 'Guardando...' };
  if (!isResting) box.appendChild(el('div', { class: 'phase-row' }, [
    el('div', { class: 'phase-pill phase-' + training.phase }, phaseLabels[training.phase]),
    el('div', { class: 'sensor-inline' }, [sensorBadge, connectBtn]),   // el botón aparece solo si se cortó
  ]));

  const plannedSets = generarPlan(state.user.profile).series;
  const nextSetNumber = training.sets.length + 1;
  const restTimerValue = el('span', { class: 'rest-timer' }, fmtTime(training.restSeconds));
  const isPaused = training.phase === 'paused';
  box.appendChild(isResting
    ? el('div', { class: 'set-progress rest-progress', role: 'timer', 'aria-live': 'off' }, [
        el('div', { class: 'rest-copy' }, [
          el('span', { class: 'rest-kicker' }, `Serie ${training.sets.length} completada`),
          el('strong', {}, ` TIEMPO DE DESCANSO`),
          el('span', { class: 'rest-caption' }, 'Segundos transcurridos'),
        ]),
        restTimerValue,
      ])
    : el('div', { class: 'set-progress' }, [
        el('strong', {}, `Serie ${nextSetNumber} de ${plannedSets} · ${isPaused ? 'en pausa' : 'en curso'}`),
        el('span', {}, `${training.sets.length} ${training.sets.length === 1 ? 'serie completada' : 'series completadas'}`),
      ]));

    if (isResting) {
      training.ui = { refresh() { restTimerValue.textContent = fmtTime(training.restSeconds); } };
      box.appendChild(el('div', { class: 'controls-row rest-actions' }, [
        el('button', { class: 'btn-primary', onclick: trainingStartNextSet }, `Iniciar serie ${nextSetNumber}`),
        el('button', { class: 'btn-secondary', onclick: trainingAskFinish }, 'Terminar entrenamiento'),
      ]));
      return box;
    }

  const repValue = el('div', { class: 'metric-value mono' }, String(training.reps));
  const timeValue = el('div', { class: 'metric-value mono' }, fmtTime(training.setSeconds));

  box.appendChild(el('div', { class: 'metrics-row' }, [
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Reps de serie'), repValue]),
    el('div', { class: 'metric' }, [el('div', { class: 'metric-label' }, 'Tiempo de serie'), timeValue]),
  ]));

  // Indicador de fatiga: sin números, solo un color que avanza de verde a rojo y un aviso para frenar.
  const fatigueFill = el('div', { class: 'fatigue-fill' });
  const fatigueTitle = el('strong', { class: 'fatigue-title' }, '');
  const fatigueText = el('span', { class: 'fatigue-text' }, '');
  const fatigueCard = el('div', { class: 'card signal-card fatigue-card', role: 'status', 'aria-live': 'polite' }, [
    el('div', { class: 'fatigue-label' }, 'Fatiga del bíceps'),
    fatigueTitle,
    el('div', { class: 'fatigue-track' }, [fatigueFill]),
    fatigueText,
  ]);
  box.appendChild(fatigueCard);

  box.appendChild(el('div', { class: 'card activation-card' }, [
    el('div', { class: 'completed-set-list', style: 'margin-top:0; padding-top:0; border-top:0' }, [
      el('div', { class: 'completed-set-heading' }, [
        el('span', {}, 'Series completadas'),
        el('span', {}, `${training.sets.length}/${plannedSets}`),
      ]),
      ...(training.sets.length
        ? training.sets.map((set, index) => el('div', { class: 'completed-set-row' }, [
            el('span', {}, `Serie ${index + 1}`),
            el('span', { class: 'mono' }, `${set.reps} reps · ${set.duracion}`),
          ]))
        : [el('div', { class: 'completed-set-row' }, [el('span', {}, 'Todavía no registraste series')])]),
    ]),
  ]));

  // ---------- Botones según la fase ----------
  if (training.phase === 'running' || training.phase === 'paused') {
    const isRunning = training.phase === 'running';
    const completeSetBtn = el('button', { class: 'btn-primary set-complete-btn', onclick: trainingCompleteSet }, `Terminar serie ${nextSetNumber}`);
    box.appendChild(completeSetBtn);
    box.appendChild(el('div', { class: 'controls-row' }, [
      el('button', { class: 'btn-secondary', onclick: isRunning ? trainingPause : trainingResume }, isRunning ? 'Pausar' : 'Reanudar'),
      el('button', { class: 'btn-primary', onclick: trainingAskFinish }, 'Terminar entrenamiento'),
    ]));
  } else {
    const saving = training.phase === 'saving';
    const empty = training.reps === 0;
    const keepBtn = el('button', { class: 'btn-secondary', onclick: trainingKeepGoing }, 'Seguir');
    const saveBtn = el('button', { class: 'btn-primary', onclick: trainingSave },
      saving ? 'Guardando...' : (training.saveError ? 'Reintentar' : (empty ? 'Guardar igual' : 'Guardar y terminar')));
    const discardBtn = el('button', { class: 'btn-ghost', onclick: trainingDiscard }, 'Descartar sesión');
    if (saving || training.saveIndex > 0) { keepBtn.disabled = saving; saveBtn.disabled = saving; }
    if (saving || training.saveIndex > 0) {
      discardBtn.disabled = true;
      if (training.saveIndex > 0) discardBtn.title = 'Hay series guardadas; reintentá guardar las pendientes.';
    }

    box.appendChild(el('div', { class: 'card confirm-card' }, [
      el('div', { style: 'font-size:15px; font-weight:600; margin-bottom:6px' }, '¿Terminar y guardar esta sesión?'),
      el('p', { class: 'page-sub', style: 'margin:0 0 14px' },
        training.sets.length
          ? `${training.sets.length} ${training.sets.length === 1 ? 'serie registrada' : 'series registradas'} con ${training.sets.reduce((total, set) => total + set.reps, 0)} repeticiones.`
          : empty ? 'Todavía no se registró ninguna repetición.' : `${training.reps} repeticiones en ${fmtTime(training.setSeconds)}.`),
      training.sets.length ? el('div', { class: 'completed-set-list' }, training.sets.map((set, index) =>
        el('div', { class: 'completed-set-row' }, [
          el('span', {}, `Serie ${index + 1}`),
          el('span', { class: 'mono' }, `${set.reps} reps · ${set.duracion} · ${fatigaLabel(set.fatiga)}`),
        ])
      )) : null,
      training.saveError ? el('div', { class: 'error-text', style: 'margin:0 0 12px' }, training.saveError) : null,
      el('div', { class: 'controls-row' }, [keepBtn, saveBtn]),
      el('div', { style: 'text-align:center; margin-top:8px' }, [discardBtn]),
    ]));
  }

  // ---------- Actualización en vivo ----------
  let lastEstado = null;
  training.ui = {
    refresh() {
      repValue.textContent = String(training.reps);
      timeValue.textContent = fmtTime(training.setSeconds);
      restTimerValue.textContent = fmtTime(training.restSeconds);
      refreshSensor();
      const e = sensor.status === 'live' ? training.estado : 'sindatos';
      const midiendo = ['sin', 'leve', 'moderada', 'alta'].includes(e);
      const level = midiendo ? Math.min(1, training.fatiga / FATIGA_UMBRAL.alta) : 0;
      fatigueFill.style.width = (level ? Math.max(6, level * 100) : 0) + '%';
      fatigueFill.style.background = fatigueColor(level);
      if (e === lastEstado) return;
      if (lastEstado !== null) avisarFatiga(e);
      lastEstado = e;
      fatigueCard.className = 'card signal-card fatigue-card fatigue-' + e;
      fatigueTitle.textContent = {
        sindatos: 'Sin datos del sensor', esperando: 'Iniciando…', relaja: 'Relajá el brazo',
        inicia: 'INICIA', sin: 'Sin fatiga', leve: 'Fatiga leve', moderada: 'La fatiga va en aumento',
        alta: 'Frená: detectamos fatiga', sinref: 'No se pudo calibrar',
      }[e];
      fatigueText.textContent = {
        sindatos: 'La fatiga se va a mostrar cuando lleguen datos de la ESP.',
        esperando: 'Arrancando la serie en el sensor…',
        relaja: 'Dejá el brazo quieto 2 segundos: el sensor mide el reposo.',
        inicia: 'Iniciando la serie.',
        sin: 'Seguí a tu ritmo.',
        leve: 'Empezás a fatigarte. Seguí cuidando la técnica.',
        moderada: 'Cuidá la técnica en las próximas repeticiones.',
        alta: `Terminá la serie ${nextSetNumber} y descansá antes de seguir.`,
        sinref: 'Las repeticiones se siguen contando, pero sin fatiga. Revisá los electrodos, terminá la serie y empezá otra para recalibrar.',
      }[e];
    },
  };
  requestAnimationFrame(() => { if (training.ui) training.ui.refresh(); });

  return box;
}


boot();
